<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ME.zip · 记账中心</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; --bg:#080a10; --rail:#0d1019; --panel:#111520; --panel-2:#151a27; --line:#252b3a; --text:#f3f1f9; --muted:#9297aa; --gold:#f1c86b; --purple:#9b6cff; --purple-2:#6538c8; --green:#67d68b; --red:#f36b82; --blue:#68a5ff; --orange:#f0a54f; }
      * { box-sizing: border-box; }
      body { margin:0; min-width:320px; color:var(--text); background:radial-gradient(circle at 70% -10%, #2a195033, transparent 36%), var(--bg); }
      button, input, select, textarea { font:inherit; }
      button { cursor:pointer; }
      a { color:inherit; }
      .shell { display:grid; grid-template-columns:216px minmax(0,1fr); min-height:100vh; }
      .rail { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; padding:22px 14px 16px; border-right:1px solid #ffffff0d; background:linear-gradient(180deg,#111522,#0a0c13 75%); }
      .brand { display:flex; align-items:center; gap:10px; padding:0 10px 24px; border-bottom:1px solid #ffffff0d; }
      .brand-mark { display:grid; place-items:center; width:38px; height:38px; border:1px solid #f1c86b99; border-radius:50%; color:#111; background:linear-gradient(135deg,#f7dd8c,#9e6b1e); font-weight:900; }
      .brand strong { color:var(--gold); font-size:17px; letter-spacing:.02em; }
      .brand small { display:block; margin-top:2px; color:#cabd9b; font-size:10px; letter-spacing:.12em; }
      .side-label { margin:25px 12px 8px; color:#5f667a; font-size:10px; letter-spacing:.16em; text-transform:uppercase; }
      .nav { display:grid; gap:4px; }
      .nav a { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid transparent; border-radius:10px; color:#aab0c1; text-decoration:none; font-size:13px; }
      .nav a:hover { color:#fff; background:#ffffff08; }
      .nav a.active { border-color:#9b6cff75; color:#fff; background:linear-gradient(90deg,#633bc433,#9b6cff12); box-shadow:inset 3px 0 var(--purple); }
      .nav .icon { width:18px; color:#8992a8; text-align:center; }
      .nav a.active .icon { color:var(--purple); }
      .rail-foot { margin-top:auto; padding:12px; border-top:1px solid #ffffff0d; color:#7d8393; font-size:11px; line-height:1.6; }
      .main { min-width:0; padding:28px clamp(16px,3.5vw,52px) 48px; }
      .topbar { display:flex; align-items:start; justify-content:space-between; gap:18px; margin-bottom:18px; }
      .eyebrow { margin:0 0 7px; color:var(--purple); font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
      h1,h2,h3,p { margin:0; }
      h1 { font-size:clamp(24px,3vw,34px); letter-spacing:-.04em; }
      h2 { font-size:18px; }
      h3 { font-size:14px; }
      .subtitle { margin-top:7px; color:var(--muted); font-size:13px; }
      .top-actions { display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:flex-end; }
      .range-bar { display:flex; align-items:center; gap:4px; padding:3px; border:1px solid var(--line); border-radius:10px; background:#0d111a; }
      .range-bar button { padding:8px 10px; border:0; border-radius:7px; color:#aeb4c5; background:transparent; font-size:12px; }
      .range-bar button.active { color:#fff; background:linear-gradient(135deg,#5f39b6,#31205e); }
      .btn { min-height:38px; padding:0 14px; border:1px solid var(--line); border-radius:9px; color:#dfe3ee; background:#151a27; }
      .btn:hover { border-color:#9b6cff88; background:#1b2030; }
      .btn.primary { border-color:#a886ff99; color:#fff; background:linear-gradient(135deg,#7547d7,#4a2a95); box-shadow:0 8px 22px #6c40c433; }
      .btn.ghost { color:var(--muted); background:transparent; }
      .btn.danger { border-color:#7a2c43; color:#ffacbb; background:#2a1119; }
      .grid { display:grid; gap:12px; }
      .metrics { grid-template-columns:repeat(6,minmax(0,1fr)); }
      .metric { min-height:126px; padding:17px; border:1px solid var(--line); border-radius:13px; background:linear-gradient(145deg,#151a27,#0e1119); box-shadow:inset 0 1px #ffffff08; }
      .metric-label { display:flex; align-items:center; justify-content:space-between; color:#bec3d0; font-size:12px; }
      .metric-symbol { display:grid; place-items:center; width:24px; height:24px; border-radius:7px; color:#fff; background:#6d49d766; font-size:12px; }
      .metric-value { margin-top:17px; color:#fff; font-size:22px; font-weight:700; letter-spacing:-.03em; }
      .metric-value.income { color:var(--green); } .metric-value.expense { color:#f3a0ae; } .metric-value.balance { color:#c5a8ff; }
      .metric-note { margin-top:7px; color:#737b8e; font-size:11px; }
      .dashboard { grid-template-columns:minmax(0,1.4fr) minmax(280px,.75fr); margin-top:12px; }
      .panel { min-width:0; padding:18px; border:1px solid var(--line); border-radius:14px; background:linear-gradient(145deg,#131823,#0e1119); box-shadow:inset 0 1px #ffffff07; }
      .panel-head { display:flex; align-items:start; justify-content:space-between; gap:12px; margin-bottom:15px; }
      .panel-head p { margin-top:5px; color:var(--muted); font-size:11px; }
      .panel-head .link { color:#b99aff; font-size:11px; text-decoration:none; }
      .channels { grid-template-columns:repeat(5,minmax(0,1fr)); margin-top:12px; }
      .channel { min-height:146px; padding:15px; border:1px solid var(--line); border-radius:12px; background:#121722; }
      .channel-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
      .channel-name { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; }
      .channel-dot { width:9px; height:9px; border-radius:50%; background:#7b8498; } .channel-dot.alipay { background:#4d8fff; } .channel-dot.wechat { background:#65ce82; } .channel-dot.cash { background:#ae70ff; } .channel-dot.bank { background:#f0a54f; } .channel-dot.card { background:#4fc5c5; }
      .channel-status { color:#777f92; font-size:10px; }
      .channel-status.ready { color:var(--green); }
      .channel-lines { display:grid; gap:7px; margin-top:18px; color:#a9afbf; font-size:11px; }
      .channel-lines strong { float:right; color:#e7e9f1; font-weight:600; }
      .channel-foot { margin-top:15px; color:#687084; font-size:10px; }
      .chart { min-height:265px; }
      .chart svg { width:100%; height:205px; overflow:visible; }
      .chart-grid { stroke:#ffffff0b; stroke-width:1; } .chart-axis { fill:#70788b; font-size:10px; } .line-income { fill:none; stroke:var(--green); stroke-width:2.5; } .line-expense { fill:none; stroke:var(--red); stroke-width:2.5; } .line-dot-income { fill:var(--green); } .line-dot-expense { fill:var(--red); }
      .legend { display:flex; gap:14px; color:#939bae; font-size:11px; } .legend span::before { content:""; display:inline-block; width:7px; height:7px; margin-right:5px; border-radius:50%; background:var(--green); } .legend .expense::before { background:var(--red); }
      .donut-wrap { display:grid; grid-template-columns:150px minmax(0,1fr); align-items:center; gap:16px; min-height:205px; }
      .donut { position:relative; display:grid; place-items:center; width:148px; height:148px; border-radius:50%; background:conic-gradient(#36255c 0 100%); }
      .donut::after { content:""; position:absolute; inset:25px; border-radius:50%; background:#111520; box-shadow:0 0 0 1px #ffffff0c; }
      .donut-label { position:relative; z-index:1; text-align:center; font-weight:700; } .donut-label small { display:block; margin-top:3px; color:var(--muted); font-size:10px; font-weight:400; }
      .category-list { display:grid; gap:10px; max-height:205px; overflow:auto; }
      .category-row { display:grid; grid-template-columns:10px 1fr auto; align-items:center; gap:8px; color:#b6bbca; font-size:11px; } .category-row i { width:8px; height:8px; border-radius:3px; background:var(--purple); } .category-row strong { color:#dfe2eb; font-weight:600; }
      .side-stack { display:grid; gap:12px; }
      .budget-summary { display:grid; gap:12px; }
      .progress { height:7px; overflow:hidden; border-radius:99px; background:#252b39; } .progress > span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#8c5cff,#be7aff); } .progress.warn > span { background:linear-gradient(90deg,#f0a54f,#f36b82); }
      .budget-line { display:flex; justify-content:space-between; color:#adb3c2; font-size:11px; } .budget-line strong { color:#eee; }
      .recent-list { display:grid; gap:4px; }
      .recent { display:grid; grid-template-columns:29px 1fr auto; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid #ffffff08; } .recent:last-child { border-bottom:0; } .recent-icon { display:grid; place-items:center; width:28px; height:28px; border-radius:8px; color:#fff; background:#402a7777; font-size:12px; } .recent-main { min-width:0; } .recent-main strong,.recent-main span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .recent-main strong { color:#e8e9ef; font-size:12px; } .recent-main span { margin-top:3px; color:#7f8799; font-size:10px; } .recent-amount { font-size:12px; font-weight:700; } .amount-expense { color:#e5a1af; } .amount-income { color:var(--green); } .amount-transfer { color:#9da6bb; }
      .empty { display:grid; place-items:center; min-height:145px; padding:22px; border:1px dashed #30374a; border-radius:10px; color:#7f8799; text-align:center; font-size:12px; line-height:1.7; }
      .empty strong { display:block; margin-bottom:7px; color:#c4c9d8; font-size:14px; }
      .page-grid { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:12px; }
      .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
      label { display:grid; gap:7px; color:#bfc4d2; font-size:12px; } input, select, textarea { width:100%; min-height:40px; padding:0 11px; border:1px solid #2a3142; border-radius:8px; color:#edf0f7; background:#0b0f17; outline:0; } textarea { min-height:92px; padding:10px 11px; resize:vertical; } input:focus,select:focus,textarea:focus { border-color:#9b6cff; box-shadow:0 0 0 3px #9b6cff1f; } .form-full { grid-column:1/-1; }
      .table-wrap { overflow:auto; } table { width:100%; border-collapse:collapse; min-width:720px; } th,td { padding:11px 9px; border-bottom:1px solid #ffffff09; text-align:left; color:#b9bfcc; font-size:11px; white-space:nowrap; } th { color:#737b8e; font-size:10px; font-weight:600; letter-spacing:.04em; } td strong { color:#edf0f7; font-weight:600; } td .pill { display:inline-flex; padding:3px 7px; border-radius:99px; color:#bca5ff; background:#8b5cff1c; font-size:10px; }
      .merchant-summary { margin:0 0 15px; padding:16px; border:1px solid #8b6ee844; border-radius:13px; background:linear-gradient(145deg,#17152a,#111522); }
      .merchant-summary-head,.merchant-card-head { display:flex; align-items:start; justify-content:space-between; gap:12px; }
      .merchant-summary-head { margin-bottom:12px; }
      .merchant-summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; }
      .merchant-card { min-width:0; padding:14px; border:1px solid #34314d; border-radius:11px; background:#101522; }
      .merchant-card h3 { color:#f2efff; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .merchant-count { padding:4px 8px; border-radius:99px; color:#c4adff; background:#8b5cff1c; font-size:10px; white-space:nowrap; }
      .merchant-stats { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px; margin-top:14px; }
      .merchant-stats > div { min-width:0; padding:9px; border:1px solid #ffffff0d; border-radius:8px; background:#ffffff04; }
      .merchant-stats span { display:block; color:#81899b; font-size:10px; }
      .merchant-stats strong,.merchant-total { display:block; margin-top:5px; color:#f0eaff; font-size:13px; font-weight:700; }
      .merchant-total { width:100%; padding:0; border:0; color:#c9aaff; background:transparent; text-align:left; cursor:pointer; }
      .merchant-total:hover { color:#fff; text-decoration:underline; }
      .merchant-chart { margin-top:12px; padding:7px 5px 1px; border-radius:8px; background:#0c111c; }
      .merchant-chart-svg { display:block; width:100%; min-height:92px; max-height:126px; }
      .merchant-chart-svg text { fill:#6f788d; font-size:9px; }
      .budget-card { display:grid; gap:11px; padding:15px; border:1px solid #292f40; border-radius:11px; background:#121722; } .budget-card-head { display:flex; justify-content:space-between; gap:8px; } .budget-card-head strong { color:#eef; font-size:13px; } .budget-card-head span { color:#969db0; font-size:11px; }
      .report-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } .report-card { min-height:150px; } .report-card .big { margin-top:19px; color:#f0eaff; font-size:26px; font-weight:700; } .report-card p { margin-top:7px; color:#8c94a6; font-size:11px; line-height:1.6; }
      .subscription-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } .subscription-card { display:grid; gap:12px; } .subscription-meta { display:flex; justify-content:space-between; color:#9299aa; font-size:11px; } .subscription-card .big { color:#e7ddff; font-size:20px; font-weight:700; }
      .modal { position:fixed; z-index:20; inset:0; display:grid; place-items:center; padding:18px; background:#0009; backdrop-filter:blur(8px); } .modal[hidden] { display:none; } .modal-card { width:min(680px,100%); max-height:min(90vh,800px); overflow:auto; padding:22px; border:1px solid #3a4052; border-radius:16px; background:#121722; box-shadow:0 30px 90px #000b; } .modal-card.wide { width:min(980px,100%); } .modal-head { display:flex; align-items:start; justify-content:space-between; gap:15px; margin-bottom:18px; } .modal-close { width:32px; height:32px; border:1px solid var(--line); border-radius:8px; color:#bcc2d0; background:#0c1018; } .modal-foot { display:flex; justify-content:flex-end; gap:8px; margin-top:16px; } .split-row { display:grid; grid-template-columns:1fr 130px 36px; gap:8px; margin-top:8px; } .split-row button { border:1px solid #4f2c3c; border-radius:8px; color:#e8a0ae; background:#25121a; }
      .notice { margin-bottom:16px; padding:11px 13px; border-left:2px solid var(--gold); color:#c8c1ae; background:#f1c86b08; font-size:11px; line-height:1.65; }
      .inline { display:flex; align-items:center; flex-wrap:wrap; gap:9px; } .muted { color:var(--muted); font-size:11px; } .right { text-align:right; } .hidden { display:none !important; }
      @media (max-width:1100px) { .metrics { grid-template-columns:repeat(3,1fr); } .channels { grid-template-columns:repeat(3,1fr); } .dashboard,.page-grid { grid-template-columns:1fr; } .side-stack { grid-template-columns:repeat(2,minmax(0,1fr)); } }
      @media (max-width:700px) { .shell { display:block; } .rail { position:relative; height:auto; padding:12px 12px 9px; } .brand { padding-bottom:12px; } .side-label,.rail-foot { display:none; } .nav { grid-template-columns:repeat(4,1fr); margin-top:10px; } .nav a { justify-content:center; padding:8px 4px; font-size:10px; } .nav a span:last-child { display:none; } .nav .icon { width:auto; } .main { padding:18px 12px 36px; } .topbar { display:block; } .top-actions { margin-top:15px; justify-content:flex-start; } .range-bar { overflow:auto; max-width:100%; } .metrics { grid-template-columns:repeat(2,1fr); } .channels,.report-grid,.subscription-grid,.side-stack { grid-template-columns:1fr; } .form-grid { grid-template-columns:1fr; } .form-full { grid-column:auto; } .donut-wrap { grid-template-columns:1fr; justify-items:center; } .category-list { width:100%; } }
    </style>

  <body>
    <div class="shell">
      <aside class="rail">
        <div class="brand"><div class="brand-mark">M</div><div><strong>ME.zip</strong><small>觅迹 · FINANCE</small></div></div>
        <p class="side-label">个人财务空间</p>
        <nav class="nav" aria-label="记账中心导航">
          <a href="#overview" data-route="overview"><span class="icon">⌂</span><span>总览</span></a>
          <a href="#alipay" data-route="alipay"><span class="icon">▣</span><span>支付宝</span></a>
          <a href="#wechat" data-route="wechat"><span class="icon">◈</span><span>微信支付</span></a>
          <a href="#transactions" data-route="transactions"><span class="icon">≡</span><span>全部账单</span></a>
          <a href="#review" data-route="review"><span class="icon">!</span><span>待确认</span></a>
          <a href="#budgets" data-route="budgets"><span class="icon">▰</span><span>预算</span></a>
          <a href="#reports" data-route="reports"><span class="icon">◒</span><span>统计报告</span></a>
          <a href="#subscriptions" data-route="subscriptions"><span class="icon">◌</span><span>订阅</span></a>
          <a href="#settings" data-route="settings"><span class="icon">⚙</span><span>账户设置</span></a>
        </nav>
        <div class="rail-foot">V2 账单数据默认 PRIVATE BY DEFAULT，仅保存在当前浏览器。支付宝 / 微信 / 银行当前均为账单文件导入，不会伪造自动同步。</div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div><p class="eyebrow">个人财务总览</p><h1 id="page-title">记账中心</h1><p class="subtitle" id="page-subtitle">记录每一笔收支，看清钱去了哪里。</p></div>
          <div class="top-actions"><div class="range-bar" id="range-bar" aria-label="时间范围"><button data-range="all">全部时间</button><button data-range="month">本月</button><button data-range="previous">上月</button><button data-range="quarter">近 3 个月</button><button data-range="year">今年</button><button data-range="custom">自定义</button></div><button class="btn primary" data-action="open-composer">＋ 记一笔</button></div>
        </header>
        <div id="custom-range" class="inline hidden" style="margin-bottom:14px"><label>从 <input id="range-from" type="date" /></label><label>到 <input id="range-to" type="date" /></label><button class="btn" data-action="apply-custom-range">应用时间范围</button></div>
        <div class="notice"><strong>真实数据边界：</strong>V2 仅处理你主动选择的账单文件；导入前会自动识别来源、预览、去重，并把疑似内部转账、退款和未分类项目送入待确认队列。不会读取支付密码、验证码、Cookie 或银行卡敏感信息。</div>
        <section id="app" aria-live="polite"></section>
      </main>
    </div>
    <div class="modal" id="composer-modal" hidden></div>
    <div class="modal" id="import-modal" hidden></div>
    <script type="text/plain" data-legacy-inline>
      (() => {
        const KEY = 'mezip.finance.center.v1';
        const EXPENSE_CATEGORIES = ['餐饮美食','购物消费','交通出行','生活日用','住房','娱乐休闲','医疗健康','学习教育','旅行','数码','宠物','订阅服务','人情往来','其他'];
        const INCOME_CATEGORIES = ['工资','奖金','兼职','投资','退款','红包','其他收入'];
        const ACCOUNTS = [
          { key:'ALIPAY', label:'支付宝', tone:'alipay', status:'账单文件导入' },
          { key:'WECHAT_PAY', label:'微信支付', tone:'wechat', status:'账单文件导入' },
          { key:'CASH', label:'现金', tone:'cash', status:'手动记录' },
          { key:'BANK', label:'银行卡', tone:'bank', status:'手动记录' },
          { key:'CREDIT_CARD', label:'信用卡', tone:'card', status:'手动记录' },
          { key:'OTHER', label:'其他账户', tone:'other', status:'手动记录' },
        ];
        const defaultState = () => ({ transactions:[], budgets:{ totalCents:0, categories:{} }, subscriptions:[], importBatches:[], privacy:{ hideAmounts:false }, settings:{ timezone:'Asia/Taipei', currency:'CNY' } });
        const load = () => { try { const value = JSON.parse(localStorage.getItem(KEY) || 'null'); return value && Array.isArray(value.transactions) ? { ...defaultState(), ...value, budgets:{ ...defaultState().budgets, ...(value.budgets || {}) }, privacy:{ ...defaultState().privacy, ...(value.privacy || {}) } } : defaultState(); } catch { return defaultState(); } };
        let state = load();
        let route = (location.hash.replace('#','') || 'overview').split('/')[0];
        let range = 'month';
        let customRange = { from:'', to:'' };
        let composerDraft = null;
        let detailId = null;
        let importDraft = null;
        let splitRows = [];
        const app = document.querySelector('#app');
        const moneyFormatter = new Intl.NumberFormat('zh-CN', { style:'currency', currency:'CNY', minimumFractionDigits:2 });
        const save = () => localStorage.setItem(KEY, JSON.stringify(state));
        const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' }[ch]));
        const money = (cents) => state.privacy.hideAmounts ? '¥••••••' : moneyFormatter.format((Number(cents) || 0) / 100);
        const number = (cents) => state.privacy.hideAmounts ? '••••' : moneyFormatter.format((Number(cents) || 0) / 100);
        const centsFromInput = (value) => { const cleaned = String(value ?? '').replace(/[^0-9.-]/g,''); const parsed = Number(cleaned); return Number.isFinite(parsed) ? Math.round(parsed * 100) : 0; };
        const isoDate = (value) => { const date = new Date(value); return Number.isNaN(date.getTime()) ? new Date().toISOString().slice(0,10) : date.toISOString().slice(0,10); };
        const accountLabel = (key) => ACCOUNTS.find((item) => item.key === key)?.label || key || '未设置账户';

        const renderImportPreview = () => { const target=document.querySelector('#import-preview'); const button=document.querySelector('#confirm-import'); if(!target)return; if(!importDraft.rows.length){target.innerHTML=`<div class="empty"><div><strong>${escapeHtml(importDraft.status)}</strong><span>请检查导出的格式，或使用 CSV / TSV 再试一次。</span></div></div>`; if(button)button.disabled=true;return;} const amounts=totals(importDraft.rows.filter((item)=>!item.duplicate)); const dates=importDraft.rows.map((item)=>new Date(item.occurredAt)).sort((a,b)=>a-b); target.innerHTML=`<div class="grid metrics" style="grid-template-columns:repeat(5,1fr)">${metric('交易总数',`${importDraft.rows.length} 笔`,'本次文件','⌘')}${metric('收入数量',`${importDraft.rows.filter((item)=>item.type==='INCOME').length} 笔`,'预览','↗','income')}${metric('支出数量',`${importDraft.rows.filter((item)=>item.type==='EXPENSE').length} 笔`,'预览','↘','expense')}${metric('重复数量',`${importDraft.duplicates} 笔`,'将跳过','↺')}${metric('异常数量',`${importDraft.errors} 笔`,'金额 / 日期无法识别','!')}</div><p class="muted" style="margin:12px 0">时间范围：${dates[0]?.toISOString().slice(0,10)||'—'} → ${dates.at(-1)?.toISOString().slice(0,10)||'—'} · 本次可导入金额：${money(amounts.expense+amounts.income)}</p><div class="table-wrap"><table><thead><tr><th>商家</th><th>金额</th><th>类型</th><th>日期</th><th>状态</th></tr></thead><tbody>${importDraft.rows.slice(0,20).map((item)=>`<tr><td>${escapeHtml(item.merchant||'未命名')}</td><td>${money(item.amountCents)}</td><td>${transactionTypeLabel(item.type)}</td><td>${isoDate(item.occurredAt)}</td><td>${item.duplicate?'重复，将跳过':'待导入'}</td></tr>`).join('')}</tbody></table></div>${importDraft.rows.length>20?'<p class="muted" style="margin-top:10px">预览只展示前 20 行，导入仍按完整文件处理。</p>':''}`; if(button)button.disabled=false; };
        const confirmImport = () => { const rows=(importDraft?.rows||[]).filter((item)=>!item.duplicate); if(!rows.length)return; const batch={ id:`batch-${Date.now()}`, ownerId:'local-owner', source:importDraft.source, fileName:importDraft.fileName, recordCount:rows.length, duplicateCount:importDraft.duplicates, errorCount:importDraft.errors, status:'COMPLETE', createdAt:new Date().toISOString() }; state.transactions.push(...rows.map((item)=>({ ...item, importBatchId:batch.id, createdAt:batch.createdAt, updatedAt:batch.createdAt }))); state.importBatches.push(batch); save(); importDraft=null; document.querySelector('#import-modal').hidden=true; render(); };
        const handleSubmit = (event) => { if(event.target.id==='composer-form'){event.preventDefault(); const form=event.target; const amount=centsFromInput(form.querySelector('#composer-amount').value); const type=form.querySelector('#composer-type').value; if(amount<=0){alert('请输入大于 0 的金额。');return;} if(splitRows.length){const sum=splitRows.reduce((total,row)=>total+row.amountCents,0);if(sum!==amount){alert(`拆分总和 ${money(sum)} 必须等于原金额 ${money(amount)}。`);return;}} const receipt=form.querySelector('#composer-receipt').files?.[0]; const base={ id:composerDraft.id||`manual-${Date.now()}`, type, amountCents:amount, category:type==='TRANSFER'?'账户转账':form.querySelector('#composer-category').value, account:form.querySelector('#composer-account').value, destinationAccount:type==='TRANSFER'?form.querySelector('#composer-destination').value:'', merchant:form.querySelector('#composer-merchant').value.trim(), occurredAt:form.querySelector('#composer-date').value?new Date(form.querySelector('#composer-date').value).toISOString():new Date().toISOString(), note:form.querySelector('#composer-note').value.trim(), tags:form.querySelector('#composer-tags').value.trim(), receiptName:receipt?.name||composerDraft.receiptName||'', source:'MANUAL', updatedAt:new Date().toISOString() }; if(composerDraft.id){const index=state.transactions.findIndex((item)=>item.id===composerDraft.id);if(index>=0)state.transactions[index]={...state.transactions[index],...base};}else state.transactions.push(base);save();composerDraft=null;document.querySelector('#composer-modal').hidden=true;render(); } if(event.target.id==='budget-form'){event.preventDefault();state.budgets.totalCents=centsFromInput(event.target.querySelector('#total-budget').value);save();render();} if(event.target.id==='category-budget-form'){event.preventDefault();const category=event.target.querySelector('#budget-category').value;state.budgets.categories[category]=centsFromInput(event.target.querySelector('#budget-amount').value);save();render();} if(event.target.id==='subscription-form'){event.preventDefault();const form=event.target;state.subscriptions.push({id:`sub-${Date.now()}`,name:form.querySelector('#sub-name').value.trim(),amountCents:centsFromInput(form.querySelector('#sub-amount').value),period:form.querySelector('#sub-period').value,nextDate:form.querySelector('#sub-date').value,account:form.querySelector('#sub-account').value});save();document.querySelector('#composer-modal').hidden=true;render();} };
        const wireComposer = () => { const type=document.querySelector('#composer-type'); type?.addEventListener('change',()=>{const category=document.querySelector('#composer-category');const current=category.value;category.innerHTML=categoryOptions(type.value==='INCOME'?'INCOME':'EXPENSE',current);document.querySelector('#destination-wrap')?.classList.toggle('hidden',type.value!=='TRANSFER');}); document.querySelectorAll('[data-split-category]').forEach((select)=>select.addEventListener('change',(event)=>{splitRows[Number(event.target.dataset.splitCategory)].category=event.target.value;})); document.querySelectorAll('[data-split-amount]').forEach((input)=>input.addEventListener('input',(event)=>{splitRows[Number(event.target.dataset.splitAmount)].amountCents=centsFromInput(event.target.value);})); document.querySelector('#composer-form')?.addEventListener('submit',handleSubmit); };
        const renderDetail = (id) => { const item=state.transactions.find((transaction)=>transaction.id===id); if(!item)return; detailId=id; document.querySelector('#composer-modal').innerHTML=`<div class="modal-card"><div class="modal-head"><div><p class="eyebrow">账单明细</p><h2>${escapeHtml(item.merchant||'未命名交易')}</h2><p class="muted">${transactionTypeLabel(item.type)} · ${accountLabel(item.account)} · ${fmtDate(item.occurredAt)}</p></div><button class="modal-close" data-action="close-modal" data-modal="composer-modal">×</button></div><div class="grid" style="gap:10px"><div class="budget-line"><span>金额</span><strong>${item.type==='INCOME'?'+':item.type==='TRANSFER'?'':'-'}${number(item.amountCents)}</strong></div><div class="budget-line"><span>分类</span><strong>${escapeHtml(item.category||'未分类')}</strong></div><div class="budget-line"><span>来源</span><strong>${item.source==='MANUAL'?'手动':item.source}</strong></div><div class="budget-line"><span>备注</span><strong>${escapeHtml(item.note||'—')}</strong></div><div class="budget-line"><span>标签</span><strong>${escapeHtml(item.tags||'—')}</strong></div><div class="budget-line"><span>凭证</span><strong>${escapeHtml(item.receiptName||'未添加')}</strong></div></div><div class="modal-foot"><button class="btn ghost" data-action="edit" data-id="${item.id}">编辑</button><button class="btn danger" data-action="delete" data-id="${item.id}">删除</button><button class="btn primary" data-action="close-modal" data-modal="composer-modal">完成</button></div></div>`; document.querySelector('#composer-modal').hidden=false; };
        const openSubscription = (seed={}) => { document.querySelector('#composer-modal').innerHTML=`<div class="modal-card"><div class="modal-head"><div><p class="eyebrow">已确认订阅</p><h2>添加订阅</h2><p class="muted">确认后才会计入订阅中心，不会自动订阅或扣款。</p></div><button class="modal-close" data-action="close-modal" data-modal="composer-modal">×</button></div><form id="subscription-form"><div class="form-grid"><label>订阅名称<input id="sub-name" required value="${escapeHtml(seed.name||'')}" placeholder="例如：ChatGPT Plus" /></label><label>每期金额（元）<input id="sub-amount" type="number" min="0.01" step="0.01" required value="${seed.amountCents?seed.amountCents/100:''}" /></label><label>周期<select id="sub-period"><option>月</option><option>年</option></select></label><label>下次扣款日<input id="sub-date" type="date" /></label><label class="form-full">付款账户<select id="sub-account">${accountOptions(seed.account||'CASH')}</select></label></div><div class="modal-foot"><button class="btn ghost" type="button" data-action="close-modal" data-modal="composer-modal">取消</button><button class="btn primary" type="submit">确认加入</button></div></form></div>`; document.querySelector('#composer-modal').hidden=false; document.querySelector('#subscription-form').addEventListener('submit',handleSubmit); };
        const download = (filename,content,type) => { const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),300); };
        const exportCsv = () => { const header='id,type,amountCents,category,account,merchant,occurredAt,note,tags,source\n'; const rows=state.transactions.map((item)=>[item.id,item.type,item.amountCents,item.category,item.account,item.merchant,item.occurredAt,item.note,item.tags,item.source].map((value)=>`"${String(value??'').replace(/"/g,'""')}"`).join(',')).join('\n'); download('mezip-finance-transactions.csv',header+rows,'text/csv;charset=utf-8'); };
        const rollback = (id) => { const batch=state.importBatches.find((item)=>item.id===id);if(!batch)return;const linked=state.transactions.filter((item)=>item.importBatchId===id);const edited=linked.some((item)=>item.updatedAt&&item.updatedAt!==item.createdAt);if(edited&&!confirm('这批账单中有已修改记录，撤销会移除这些记录。继续吗？'))return;state.transactions=state.transactions.filter((item)=>item.importBatchId!==id);batch.status='ROLLED_BACK';save();render(); };
        const wire = () => { document.querySelectorAll('[data-action]').forEach((element)=>element.addEventListener('click',(event)=>{ const action=element.dataset.action; if(action==='open-composer')openComposer(); if(action==='open-import')openImport(element.dataset.source==='WECHAT_PAY'?'WECHAT':'ALIPAY'); if(action==='close-modal'){document.querySelector(`#${element.dataset.modal}`).hidden=true;} if(action==='detail')renderDetail(element.dataset.id); if(action==='edit'){const id=element.dataset.id;document.querySelector('#composer-modal').hidden=true;openComposer(id);} if(action==='delete'){if(confirm('确认删除这条本机账单吗？')){state.transactions=state.transactions.filter((item)=>item.id!==element.dataset.id);save();document.querySelector('#composer-modal').hidden=true;render();}} if(action==='add-split'){splitRows.push({category:EXPENSE_CATEGORIES[0],amountCents:0});renderComposer();} if(action==='remove-split'){splitRows.splice(Number(element.dataset.index),1);renderComposer();} if(action==='apply-custom-range'){range='custom';customRange.from=document.querySelector('#range-from').value;customRange.to=document.querySelector('#range-to').value;render();} if(action==='confirm-subscription')openSubscription({name:element.dataset.merchant,amountCents:Number(element.dataset.amount),account:element.dataset.account}); if(action==='open-subscription')openSubscription(); if(action==='remove-subscription'){state.subscriptions=state.subscriptions.filter((item)=>item.id!==element.dataset.id);save();render();} if(action==='rollback-batch')rollback(element.dataset.id); if(action==='export-csv')exportCsv(); if(action==='export-json')download('mezip-finance-backup.json',JSON.stringify(state,null,2),'application/json'); if(action==='confirm-import')confirmImport(); })); document.querySelectorAll('[data-range]').forEach((button)=>button.addEventListener('click',()=>{range=button.dataset.range;render();})); document.querySelector('#hide-amounts')?.addEventListener('change',(event)=>{state.privacy.hideAmounts=event.target.checked;save();render();}); document.querySelector('#tx-search')?.addEventListener('input',()=>filterTransactions()); document.querySelectorAll('#tx-account,#tx-type,#tx-category').forEach((select)=>select.addEventListener('change',()=>filterTransactions())); document.querySelector('#composer-form')?.addEventListener('submit',handleSubmit); document.querySelector('#budget-form')?.addEventListener('submit',handleSubmit); document.querySelector('#category-budget-form')?.addEventListener('submit',handleSubmit); };
        const filterTransactions = () => { const query=document.querySelector('#tx-search')?.value.trim().toLowerCase()||'';const account=document.querySelector('#tx-account')?.value||'';const type=document.querySelector('#tx-type')?.value||'';const category=document.querySelector('#tx-category')?.value||'';const items=state.transactions.filter((item)=>{const hay=[item.merchant,item.note,item.tags,item.category].join(' ').toLowerCase();return(!query||hay.includes(query))&&(!account||item.account===account)&&(!type||item.type===type)&&(!category||item.category===category);});const target=document.querySelector('#tx-table');if(target)target.innerHTML=renderTransactionTable(items); };
        document.addEventListener('click',(event)=>{ const link=event.target.closest('a[data-route]');if(link){event.preventDefault();location.hash=link.dataset.route;} });
        window.addEventListener('hashchange',()=>{route=(location.hash.replace('#','')||'overview').split('?')[0].split('/')[0]||'overview';render();});
        render();
      })();
    </script>
    <script type="text/pulse-finance-deferred" data-src="/local-apps/finance-center-v2/finance-core.js"></script>
    <script type="text/pulse-finance-deferred" data-src="/local-apps/finance-center-v2/finance-v2.js"></script>
  <script src="/local-apps/finance-adapter.js"></script>
</body>
