<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预约系统 · 15 分钟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#141416;
    --panel-2:#111113;
    --border:rgba(255,255,255,0.10);
    --border-soft:rgba(255,255,255,0.06);
    --cream:#efe9da;
    --muted:#8a8a8f;
    --gold:#c9b98f;
    --disabled:#4a4a4d;
    --ok:#7bd88f;
    --err:#e08a8a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:'Noto Sans SC','Space Grotesk',sans-serif;
    padding:0 0 80px;
  }
  .banner-wrap{ display:flex; justify-content:flex-end; padding:0 clamp(16px,5vw,60px); }
  .banner{
    margin-top:0; padding:22px 28px; border-radius:0 0 20px 20px;
    background:linear-gradient(120deg,#1c3fae,#3a7bd5 60%, #63a8ff);
    color:#eaf1ff; font-size:14px; font-weight:500; max-width:520px;
    box-shadow:0 20px 50px -20px rgba(30,80,220,0.55);
  }
  .disclaimer{
    max-width:1200px; margin:18px auto 0; padding:0 clamp(16px,5vw,60px);
    font-size:12.5px; color:var(--muted);
  }
  .hr{ max-width:1200px; margin:26px auto 0; border-top:1px solid var(--border-soft); }

  main{ max-width:1200px; margin:0 auto; padding:34px clamp(16px,5vw,60px) 0; }
  .eyebrow{ font-size:12px; letter-spacing:2.5px; color:var(--gold); font-weight:600; text-transform:uppercase; }
  h1{ font-size:clamp(26px,3.4vw,32px); font-weight:900; margin:12px 0 10px; color:var(--cream); }
  .lead{ font-size:14px; color:#c7c3ba; max-width:680px; line-height:1.8; margin:0 0 26px; font-weight:300;}
  .lead b{ color:var(--cream); font-weight:500;}

  .step{ display:none; }
  .step.active{ display:block; }

  /* ---------- step 1: calendar ---------- */
  .booker{
    display:grid; grid-template-columns: 230px 1fr 190px;
    border:1px solid var(--border); border-radius:18px; overflow:hidden;
    background:var(--panel);
  }
  .col{ padding:26px 22px; }
  .col-profile{ background:var(--panel-2); border-right:1px solid var(--border-soft); }
  .avatar{
    width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #b06be0, #6a2fb0);
    display:flex;align-items:center;justify-content:center;
    font-weight:700; font-size:16px; color:#fff; margin-bottom:16px;
  }
  .p-name{ font-size:19px; font-weight:700; margin-bottom:6px; }
  .p-title{ font-size:22px; font-weight:800; margin-bottom:18px; color:var(--cream); }
  .p-meta{ display:flex; flex-direction:column; gap:10px; font-size:13px; color:#c9c5ba; }
  .p-meta div{ display:flex; align-items:center; gap:8px; }
  .p-meta svg{ width:14px; height:14px; opacity:0.7; flex:none; }
  .p-email{ margin-top:6px; word-break:break-all; color:var(--muted); font-size:12.5px; }

  .col-cal{ border-right:1px solid var(--border-soft); }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .cal-head .m-label{ font-size:19px; font-weight:800; }
  .cal-nav{ display:flex; gap:6px; }
  .cal-nav button{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:transparent;
    color:var(--cream); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  .cal-nav button:hover{ background:rgba(255,255,255,0.06); }
  table.cal{ width:100%; border-collapse:collapse; }
  table.cal th{ font-size:12px; color:var(--muted); font-weight:500; padding-bottom:10px; }
  table.cal td{ text-align:center; padding:5px 0; }
  .day{
    width:36px; height:36px; line-height:36px; border-radius:10px; margin:0 auto;
    font-size:13.5px; cursor:pointer; color:#d7d3c8; transition:background 150ms ease;
  }
  .day.disabled{ color:var(--disabled); cursor:default; }
  .day.available:hover{ background:rgba(255,255,255,0.08); }
  .day.selected{ background:#f4f1e8; color:#111; font-weight:700; }
  .cal-note{ margin-top:16px; font-size:11.5px; color:var(--muted); line-height:1.7;}

  .col-times{ display:flex; flex-direction:column; }
  .t-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .t-day{ font-size:13px; font-weight:700; line-height:1.3; }
  .all-day-badge{ display:inline-flex; align-items:center; min-height:24px; padding:0 9px; border:1px solid rgba(201,185,143,.48); border-radius:99px; color:var(--gold); font-size:11px; font-weight:700; }
  .time-placeholder{ padding:18px 0; color:var(--muted); font-size:12.5px; line-height:1.7; }
  .time-picker{ display:grid; gap:15px; }
  .time-picker-note{ margin:0; color:#c9c5ba; font-size:12px; line-height:1.65; }
  .time-sliders{ display:grid; gap:9px; }
  .time-slider{ display:grid; grid-template-columns:28px minmax(0,1fr) 42px; align-items:center; gap:10px; min-height:50px; padding:0 12px; border:1px solid var(--border); border-radius:11px; background:var(--panel-2); }
  .time-slider-label{ color:var(--muted); font-size:12px; font-weight:700; text-align:center; }
  .time-slider input[type="range"]{ width:100%; min-width:0; margin:0; accent-color:var(--gold); cursor:ew-resize; }
  .time-slider input[type="range"]:focus-visible{ outline:2px solid var(--gold); outline-offset:4px; border-radius:999px; }
  .time-slider output{ color:var(--cream); font:700 15px 'Space Grotesk',sans-serif; font-variant-numeric:tabular-nums; text-align:right; }
  .time-preview{ padding:12px 13px; border:1px solid rgba(201,185,143,.32); border-radius:10px; color:var(--cream); background:rgba(201,185,143,.06); font:700 16px 'Space Grotesk',sans-serif; text-align:center; letter-spacing:.05em; }

  .continue-row{ margin-top:22px; display:flex; justify-content:flex-end; }
  .btn{
    border:1px solid var(--border); background:var(--cream); color:#111;
    padding:11px 22px; border-radius:10px; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .btn:disabled{ background:transparent; color:var(--disabled); border-color:var(--border); cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--cream); }
  .btn-ghost:hover{ background:rgba(255,255,255,0.06); }

  .replay{ margin-top:22px; }
  .replay button{
    background:transparent; border:1px solid var(--border); color:var(--muted);
    padding:9px 16px; border-radius:9px; font-size:12.5px; cursor:pointer;
  }
  .replay button:hover{ color:var(--cream); border-color:var(--gold); }

  /* ---------- step 2: form ---------- */
  .form-card{
    border:1px solid var(--border); border-radius:18px; background:var(--panel);
    padding:30px clamp(20px,4vw,40px); max-width:640px;
  }
  .form-card .sum{ font-size:13px; color:var(--gold); font-weight:600; margin-bottom:6px; letter-spacing:1px; }
  .form-card h2{ font-size:20px; margin:0 0 22px; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:7px; }
  .field input, .field textarea{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:9px;
    padding:11px 13px; color:var(--cream); font-size:14px; font-family:inherit;
  }
  .field textarea{ min-height:80px; resize:vertical; }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--gold); }
  .form-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:24px; }

  /* ---------- step 3: confirmation ---------- */
  .confirm-card{
    border:1px solid var(--border); border-radius:18px; background:var(--panel);
    padding:32px clamp(20px,4vw,44px); max-width:820px;
  }
  .confirm-card .eyebrow2{ font-size:12.5px; color:var(--muted); letter-spacing:1.5px; margin-bottom:8px;}
  .confirm-card h2{ font-size:24px; margin:0 0 6px; color:#eef6ea; }
  .confirm-when{ font-size:14.5px; font-weight:600; color:var(--cream); margin-bottom:20px; }
  .kv{ display:flex; gap:10px; font-size:14px; margin-bottom:9px; }
  .kv .k{ color:var(--muted); min-width:80px; }
  .kv .v{ color:var(--cream); }

  .status-box{
    margin-top:20px; border-radius:12px; padding:14px 16px; font-size:13px; line-height:1.8;
    border:1px solid var(--border);
  }
  .status-box.sending{ color:var(--gold); border-color:rgba(201,185,143,0.35); background:rgba(201,185,143,0.06); }
  .status-box.ok{ color:var(--ok); border-color:rgba(123,216,143,0.35); background:rgba(123,216,143,0.07); }
  .status-box.fail{ color:var(--err); border-color:rgba(224,138,138,0.35); background:rgba(224,138,138,0.07); }
  .status-box b{ color:inherit; }

  .after-line{ margin-top:16px; font-size:13.5px; color:#c7c3ba; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
  .btn-row a, .btn-row button{
    font-size:13px; padding:10px 16px; border-radius:9px; border:1px solid var(--border);
    text-decoration:none; color:var(--cream); background:transparent; cursor:pointer; font-weight:600;
  }
  .btn-row a.primary, .btn-row button.primary{ background:var(--gold); color:#1a1607; border-color:var(--gold); }
  .btn-row a:hover, .btn-row button:hover{ border-color:var(--gold); }
  .btn-row button:disabled{ opacity:0.5; cursor:not-allowed; }
  .day{border:0;background:transparent;color:inherit;font-family:inherit;padding:0;font-size:14px} .day:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .lead,.p-meta,.time-picker-note,.time-placeholder,.cal-note,.field label,.btn,.status-box{font-size:16px} table.cal th{font-size:14px} .kv .v{overflow-wrap:anywhere;white-space:pre-wrap}.kv{align-items:flex-start}.col-times{min-width:0}.time-slider{grid-template-columns:20px minmax(0,1fr) 30px;gap:7px;padding:0 8px}
  .booker{grid-template-columns:210px minmax(260px,1fr) 230px}.after-line,.p-email{overflow-wrap:anywhere}.form-actions{gap:12px;flex-wrap:wrap}
  @media(max-width:950px){.booker{grid-template-columns:180px minmax(260px,1fr)}.col-times{grid-column:1/-1;border-top:1px solid var(--border)}.col-cal{border-right:0}.time-sliders{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:600px){main{padding:24px 16px 0}.booker{grid-template-columns:minmax(0,1fr)}.col-profile{border-right:0;border-bottom:1px solid var(--border)}.col{padding:22px 18px}.p-meta{gap:8px}.col-times{grid-column:auto}.time-sliders{grid-template-columns:1fr}.day{width:38px;height:38px}.form-card,.confirm-card{padding:24px 18px}.kv{flex-direction:column;gap:3px}}
</style>
<link rel="stylesheet" href="/booking/pulse-skin.css">
<script src="/booking/pulse-skin.js"></script>
</head>
<body>

<main>
  <div class="eyebrow">ALEX · DISCOVERY CALL</div>
  <h1>预约时间</h1>
  <p class="lead">选择日期与准确的时、分、秒后，会进入资料填写页面。全天 24 小时均可选择，时区为 <b>中国标准时间（UTC+8）</b>。</p>

  <!-- STEP 1 -->
  <section class="step active" id="step1">
    <div class="booker">
      <div class="col col-profile">
        <div class="avatar">A</div>
        <div class="p-name">Alex</div>
        <div class="p-title">Discovery call</div>
        <div class="p-meta">
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg> 15 分钟</div>
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M17 10l4-2v8l-4-2"/></svg> 沟通方式另行确认</div>
          <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 4 5.7 4 9s-1.5 6.4-4 9c-2.5-2.6-4-5.7-4-9s1.5-6.4 4-9z"/></svg> UTC+8</div>
        </div>
        <div class="p-email" id="tomEmailLabel"></div>
      </div>

      <div class="col col-cal">
        <div class="cal-head">
          <div class="m-label" id="monthLabel"></div>
          <div class="cal-nav">
            <button id="prevMonth" aria-label="上个月">‹</button>
            <button id="nextMonth" aria-label="下个月">›</button>
          </div>
        </div>
        <table class="cal">
          <thead><tr><th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th></tr></thead>
          <tbody id="calBody"></tbody>
        </table>
        <div class="cal-note">深色日期不可预约；使用箭头可继续选择后续月份。</div>
      </div>

      <div class="col col-times">
        <div class="t-head">
          <div class="t-day" id="tDayLabel">选择日期</div>
          <span class="all-day-badge">全天可预约</span>
        </div>
        <div id="timePicker" class="time-placeholder">先在左侧选择日期，再选择准确的时、分、秒。</div>
      </div>
    </div>

    <div class="continue-row">
      <button class="btn" id="toStep2" disabled>下一步：填写资料</button>
    </div>

    <div class="replay"><button id="replay1">重新选择时间</button></div>
  </section>

  <!-- STEP 2 -->
  <section class="step" id="step2">
    <div class="form-card">
      <div class="sum" id="sumLine2"></div>
      <h2>填写你的资料</h2>
      <div class="field"><label for="fName">称呼</label><input maxlength="120" type="text" id="fName" placeholder="怎么称呼你？"></div>
      <div class="field"><label for="fEmail">联系邮箱</label><input required maxlength="254" type="email" id="fEmail" placeholder="you@example.com"></div>
      <div class="field"><label for="fNotes">意见建议（选填）</label><textarea maxlength="2000" id="fNotes" placeholder="想先聊聊什么？"></textarea></div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="back1">返回修改</button>
        <button class="btn" id="toStep3">确认预约</button>
      </div>
    </div>
  </section>

  <!-- STEP 3 -->
  <section class="step" id="step3">
    <div class="confirm-card">
      <div class="eyebrow2">预约请求</div>
      <h2>资料已准备好</h2>
      <div class="confirm-when" id="confirmWhen"></div>
      <div class="kv"><div class="k">称呼</div><div class="v" id="cName"></div></div>
      <div class="kv"><div class="k">联系邮箱</div><div class="v" id="cEmail"></div></div>
      <div class="kv"><div class="k">意见建议</div><div class="v" id="cNotes"></div></div>

      <div class="status-box sending" id="statusBox">正在保存预约…</div>
      <div class="after-line">联系邮箱：<b id="notifyTarget"></b></div>

      <div class="btn-row">
        <button class="primary" id="retrySend">重新提交</button>
        <a href="#" id="mailtoBtn">邮件联系</a>
        <button id="back2">返回修改</button>
      </div>
    </div>
    <div class="replay"><button id="replay2">重新选择时间</button></div>
  </section>
</main>

<script>
(function(){
  const ALEX_EMAIL = "account1@example.com";
  document.getElementById('tomEmailLabel').textContent = ALEX_EMAIL;
  document.getElementById('notifyTarget').textContent = ALEX_EMAIL;

  const weekdayNames = ['日','一','二','三','四','五','六'];
  const chinaNow = () => new Date(new Date().toLocaleString('en-US', {timeZone:'Asia/Shanghai'}));
  const initialViewDate = chinaNow();
  let viewYear = initialViewDate.getFullYear(), viewMonth = initialViewDate.getMonth();
  let selectedDate = null;
  let selectedTime = null;

  const twoDigits = value => String(value).padStart(2,'0');

  function renderCalendar(){
    document.getElementById('monthLabel').textContent = viewYear + ' 年 ' + (viewMonth+1) + ' 月';
    const body = document.getElementById('calBody');
    body.innerHTML = '';
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const today = chinaNow();
    today.setHours(0,0,0,0);

    let cells = [];
    for(let i=0;i<firstDay;i++) cells.push(null);
    for(let d=1; d<=daysInMonth; d++) cells.push(d);
    while(cells.length % 7 !== 0) cells.push(null);

    for(let r=0; r<cells.length/7; r++){
      const tr = document.createElement('tr');
      for(let c=0;c<7;c++){
        const d = cells[r*7+c];
        const td = document.createElement('td');
        if(d){
          const cellDate = new Date(viewYear, viewMonth, d);
          const isPast = cellDate < today;
          const div = document.createElement('button');
          div.type = 'button'; div.disabled = isPast;
          div.setAttribute('aria-label', `${viewYear}年${viewMonth+1}月${d}日`);
          div.className = 'day ' + (isPast ? 'disabled' : 'available');
          div.textContent = d;
          if(selectedDate && selectedDate.y===viewYear && selectedDate.m===viewMonth && selectedDate.d===d){
            div.classList.add('selected');
          }
          if(!isPast){
            div.addEventListener('click', () => {
              selectedDate = {y:viewYear, m:viewMonth, d:d};
              renderCalendar();
              renderTimes();
              updateContinueState();
            });
          }
          td.appendChild(div);
        }
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }
  }

  function renderTimes(){
    const picker = document.getElementById('timePicker');
    const label = document.getElementById('tDayLabel');
    if(!selectedDate){
      label.textContent = '先在左侧选择日期';
      picker.className = 'time-placeholder';
      picker.textContent = '先在左侧选择日期，再选择准确的时、分、秒。';
      return;
    }
    label.innerHTML = '周' + weekdayNames[new Date(selectedDate.y,selectedDate.m,selectedDate.d).getDay()] + '<br>' + selectedDate.d + '日';
    const [hour='00', minute='00', second='00'] = (selectedTime || '00:00:00').split(':');
    picker.className = 'time-picker';
    picker.innerHTML = `<p class="time-picker-note">拖动滑块选择全天任意时刻：小时按 1 小时、分钟和秒按 1 单位滑动。</p><div class="time-sliders" role="group" aria-label="预约时间滑动选择"><label class="time-slider"><span class="time-slider-label">时</span><input id="hourRange" type="range" min="0" max="23" step="1" value="${Number(hour)}" aria-label="预约小时" /><output id="hourValue" for="hourRange"></output></label><label class="time-slider"><span class="time-slider-label">分</span><input id="minuteRange" type="range" min="0" max="59" step="1" value="${Number(minute)}" aria-label="预约分钟" /><output id="minuteValue" for="minuteRange"></output></label><label class="time-slider"><span class="time-slider-label">秒</span><input id="secondRange" type="range" min="0" max="59" step="1" value="${Number(second)}" aria-label="预约秒数" /><output id="secondValue" for="secondRange"></output></label></div><div class="time-preview" id="timePreview"></div>`;
    const syncTime = () => {
      const selectedHour = twoDigits(document.getElementById('hourRange').value);
      const selectedMinute = twoDigits(document.getElementById('minuteRange').value);
      const selectedSecond = twoDigits(document.getElementById('secondRange').value);
      selectedTime = `${selectedHour}:${selectedMinute}:${selectedSecond}`;
      document.getElementById('hourValue').textContent = selectedHour;
      document.getElementById('minuteValue').textContent = selectedMinute;
      document.getElementById('secondValue').textContent = selectedSecond;
      document.getElementById('timePreview').textContent = selectedTime;
      updateContinueState();
    };
    ['hourRange','minuteRange','secondRange'].forEach(id => document.getElementById(id).addEventListener('input', syncTime));
    syncTime();
  }

  function updateContinueState(){
    document.getElementById('toStep2').disabled = !(selectedDate && selectedTime);
  }

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--; if(viewMonth<0){ viewMonth=11; viewYear--; }
    renderCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++; if(viewMonth>11){ viewMonth=0; viewYear++; }
    renderCalendar();
  });

  renderCalendar();
  renderTimes();

  // ---- step navigation ----
  const steps = { 1: document.getElementById('step1'), 2: document.getElementById('step2'), 3: document.getElementById('step3') };
  function goTo(n){
    Object.values(steps).forEach(s => s.classList.remove('active'));
    steps[n].classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function whenText(){
    if(!selectedDate) return '';
    const dateStr = selectedDate.y + '-' + String(selectedDate.m+1).padStart(2,'0') + '-' + String(selectedDate.d).padStart(2,'0');
    return dateStr + ' ' + selectedTime + ' · 15 分钟 · UTC+8';
  }

  document.getElementById('toStep2').addEventListener('click', () => {
    document.getElementById('sumLine2').textContent = whenText();
    goTo(2);
  });
  document.getElementById('back1').addEventListener('click', () => goTo(1));

  let lastPayload = null;

  let submitting = false;
  let saved = false;
  let notificationComplete = false;
  async function sendBooking(){
    if (submitting || notificationComplete || !lastPayload) return;
    submitting = true;
    const statusBox = document.getElementById('statusBox');
    statusBox.className = 'status-box sending';
    statusBox.textContent = '正在保存预约…';
    document.getElementById('retrySend').disabled = true;
    document.getElementById('back2').disabled = true;
    try {
      const response = await fetch('/api/booking', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(lastPayload)});
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || '暂时无法确认预约结果');
      saved = true;
      notificationComplete = ['sent','failed'].includes(data.notification);
      document.querySelector('.confirm-card h2').textContent = '预约已保存';
      statusBox.className = 'status-box ok';
      const messages = {sent:'邮件通知已发送。',pending:'邮件通知尚未发送；预约记录已保留。',sending:'正在核对邮件通知结果；预约记录已保留。',failed:'邮件通知发送失败；预约记录已保留，可通过下方邮箱联系。'};
      statusBox.textContent = '预约已保存。' + (messages[data.notification] || messages.sending) + ' 预约编号：' + data.id;
      window.parent.postMessage({type:'pulse-booking-saved'},window.location.origin);
    } catch (error) {
      statusBox.className = 'status-box fail';
      statusBox.textContent = error.message + '。内容已保留，重新提交会核对同一笔预约。';
    } finally {
      submitting = false;
      document.getElementById('retrySend').disabled = notificationComplete;
      document.getElementById('retrySend').textContent = saved ? '尝试发送通知' : '重新提交';
      document.getElementById('back2').disabled = saved;
    }
  }

  document.getElementById('toStep3').addEventListener('click', () => {
    const emailInput = document.getElementById('fEmail');
    if (!emailInput.reportValidity()) return;
    if (Date.parse(`${selectedDate.y}-${twoDigits(selectedDate.m+1)}-${twoDigits(selectedDate.d)}T${selectedTime}+08:00`) <= Date.now()) { alert('请选择未来的时间。'); return; }
    const rawName = document.getElementById('fName').value.trim();
    const rawEmail = document.getElementById('fEmail').value.trim();
    const rawNotes = document.getElementById('fNotes').value.trim();
    const name = rawName || '未填写';
    const email = rawEmail || '未填写';
    const notes = rawNotes || '（无）';

    document.getElementById('confirmWhen').textContent = whenText();
    document.getElementById('cName').textContent = name;
    document.getElementById('cEmail').textContent = email;
    document.getElementById('cNotes').textContent = notes;

    const dateStr = selectedDate.y + '-' + String(selectedDate.m+1).padStart(2,'0') + '-' + String(selectedDate.d).padStart(2,'0');
    const fields = { date: dateStr, time: selectedTime, name: rawName, email: rawEmail, notes: rawNotes };
    const unchanged = lastPayload && Object.entries(fields).every(([key,value]) => lastPayload[key] === value);
    lastPayload = {id:unchanged ? lastPayload.id : crypto.randomUUID(),...fields};

    const subject = encodeURIComponent('Discovery Call 预约 · ' + whenText());
    const body = encodeURIComponent(
      '预约时间：' + whenText() + '\n' +
      '称呼：' + name + '\n' +
      '联系邮箱：' + email + '\n' +
      '意见建议：' + notes
    );
    document.getElementById('mailtoBtn').href = 'mailto:' + ALEX_EMAIL + '?subject=' + subject + '&body=' + body;

    goTo(3);
    sendBooking();
  });

  document.getElementById('retrySend').addEventListener('click', sendBooking);
  document.getElementById('back2').addEventListener('click', () => goTo(2));

  function resetAll(){
    if (submitting) return;
    saved = false; notificationComplete = false; lastPayload = null;
    document.querySelector('.confirm-card h2').textContent = '资料已准备好';
    document.getElementById('back2').disabled = false;
    selectedDate = null; selectedTime = null;
    document.getElementById('fName').value = '';
    document.getElementById('fEmail').value = '';
    document.getElementById('fNotes').value = '';
    renderCalendar(); renderTimes(); updateContinueState();
    goTo(1);
  }
  document.getElementById('replay1').addEventListener('click', resetAll);
  document.getElementById('replay2').addEventListener('click', resetAll);
})();
</script>

</body>
</html>
