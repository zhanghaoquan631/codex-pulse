<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101018" />
    <title>ME.zip · 登录后空间 · 新版</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; color: #f8f2e6; background: #0e0e14; }
      button { font: inherit; cursor: pointer; }
      .page { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 18% 12%, #d9785c38, transparent 28%), radial-gradient(circle at 84% 78%, #6c8fe738, transparent 30%), #0e0e14; }
      .panel { width: min(880px, 100%); padding: clamp(22px, 4vw, 40px); border: 1px solid #ffffff18; border-radius: 30px; background: #15151ddd; box-shadow: 0 30px 100px #000b, inset 0 1px #fff2; }
      .panel.cards { width: min(560px, 100%); padding: 0; border: 0; background: transparent; box-shadow: none; }
      .eyebrow { margin: 0 0 8px; color: #f2cc87; font-size: 12px; letter-spacing: .12em; }
      h1, h2, p { margin: 0; }
      h1 { font-size: clamp(28px, 5vw, 46px); line-height: 1.1; }
      .muted { margin-top: 12px; color: #d7d0c5b3; line-height: 1.7; }
      .card-heading { display: grid; gap: 5px; }
      .card-stage { position: relative; width: min(100%, 460px); aspect-ratio: 2 / 3; margin: 0 auto; overflow: hidden; cursor: grab; touch-action: pan-y; user-select: none; }
      .card-stage:active { cursor: grabbing; }
      .card-image { width: 100%; height: 100%; display: block; object-fit: cover; pointer-events: none; }
      .card-hint { position: absolute; right: 14px; bottom: 14px; padding: 7px 10px; border: 1px solid #fff4; border-radius: 999px; color: #fff; background: #08080baa; font-size: 12px; backdrop-filter: blur(8px); }
      .card-footer { display: grid; justify-items: center; gap: 10px; color: #c9c0b3; font-size: 13px; }
      .dots { display: flex; gap: 7px; }
      .dot { width: 7px; height: 7px; border-radius: 99px; background: #fff4; }
      .dot.active { width: 22px; background: #f2cc87; }
      .features { display: grid; gap: 24px; }
      .features-heading { display: grid; gap: 9px; }
      .feature-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      .feature { --accent: #f2cc87; position: relative; isolation: isolate; display: grid; align-content: end; min-height: 126px; padding: 20px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--accent) 48%, transparent); border-radius: 22px; color: #fff8ec; text-decoration: none; background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 27%, #17161a), #111218 76%); box-shadow: inset 0 1px #fff2, 0 16px 36px #0005; transition: border-color .2s, transform .2s, box-shadow .2s; }
      .feature::before { content: ''; position: absolute; z-index: -1; width: 130px; height: 130px; right: -46px; top: -46px; border-radius: 50%; background: color-mix(in srgb, var(--accent) 35%, transparent); opacity: .8; }
      .feature::after { content: ''; position: absolute; z-index: -1; width: 76px; height: 2px; left: 20px; top: 20px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 82%, transparent); }
      .feature:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: inset 0 1px #fff3, 0 22px 44px #0008; }
      .feature-title { font-size: 19px; font-weight: 700; letter-spacing: .02em; }
      .feature-note { margin-top: 7px; color: #e7d9c5; font-size: 13px; line-height: 1.5; }
      .life { --accent: #e7a85b; } .community { --accent: #d878a5; } .fitness { --accent: #73c7a1; } .history { --accent: #8fb8ef; } .timeline { --accent: #b89bf2; } .membership { --accent: #f0c36d; grid-column: span 2; } .benefits { --accent: #f28b78; } .github { --accent: #b9c4d4; } .x { --accent: #80d4e8; }
      .connection-note { margin-top: -8px; color: #c9c0b3; font-size: 13px; line-height: 1.6; }
      .secondary { justify-self: start; min-height: 40px; padding: 0 16px; border: 1px solid #ffffff2e; border-radius: 999px; color: #eee4d3; background: transparent; }
      @media (max-width: 700px) { .feature-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .membership { grid-column: span 2; } }
      @media (max-width: 560px) { .page { padding: 12px; } .panel { border-radius: 20px; padding: 18px; } .feature-grid { grid-template-columns: 1fr; } .membership { grid-column: auto; } }
      @media (prefers-reduced-motion: reduce) { .feature { transition: none; } .feature:hover { transform: none; } }
    </style>
  </head>
  <body>
    <main id="app" class="page" aria-live="polite"></main>
    <script>
      (() => {
        const root = document.querySelector('#app');
        const cards = ['/after-login-cards/card-1-cropped.jpg', '/after-login-cards/card-2.jpg', '/after-login-cards/card-3-cropped.jpg', '/after-login-cards/card-4.jpg'];
        const returnTo = '/post-login-app-v2/index.html?fromLogin=1';
        const rawSession = localStorage.getItem('mezip.local-demo-session.v1');
        const hasDemoSession = rawSession === 'active' || rawSession?.includes('"state":"active"');
        const fromLogin = new URLSearchParams(location.search).get('fromLogin') === '1';
        const loginComplete = sessionStorage.getItem('mezip-post-login-app-v2-login-v1') === '1';
        if (!fromLogin && !(hasDemoSession && loginComplete)) { sessionStorage.removeItem('mezip-post-login-app-v2-state'); location.replace(`/?login=1&returnTo=${encodeURIComponent(returnTo)}`); return; }
        if (fromLogin && !hasDemoSession) { location.replace(`/?login=1&returnTo=${encodeURIComponent(returnTo)}`); return; }
        if (fromLogin) { sessionStorage.setItem('mezip-post-login-app-v2-login-v1', '1'); sessionStorage.removeItem('mezip-post-login-app-v2-state'); history.replaceState({}, '', '/post-login-app-v2/index.html'); }
        let step = sessionStorage.getItem('mezip-post-login-app-v2-state') === 'features' ? 'features' : 'cards';
        let cardIndex = 0; let startX = null;
        const render = () => {
          if (step === 'cards') {
            root.innerHTML = `<section class="panel cards" aria-labelledby="cards-title"><div class="card-heading"><p class="eyebrow">登录后 · 介绍卡</p><h1 id="cards-title">先看看这里，再开始记录</h1><p class="muted">第 ${cardIndex + 1} / ${cards.length} 张 · 点击卡片或向左滑动</p></div><div class="card-stage" id="card-stage" role="button" tabindex="0" aria-label="第 ${cardIndex + 1} 张介绍卡，点击或向左滑动继续"><img class="card-image" src="${cards[cardIndex]}" alt="登录后介绍卡 ${cardIndex + 1}" draggable="false"><span class="card-hint">${cardIndex === cards.length - 1 ? '点击进入功能区' : '点击或向左滑动'}</span></div><div class="card-footer"><div class="dots" aria-label="当前进度">${cards.map((_, i) => `<span class="dot ${i === cardIndex ? 'active' : ''}"></span>`).join('')}</div><span>${cardIndex === cards.length - 1 ? '点击进入功能区' : '点击或向左滑动继续'}</span></div></section>`;
            const advance = () => { if (cardIndex + 1 >= cards.length) { step = 'features'; sessionStorage.setItem('mezip-post-login-app-v2-state', 'features'); render(); return; } cardIndex += 1; render(); };
            const stage = document.querySelector('#card-stage'); stage.addEventListener('click', advance); stage.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); advance(); } }); stage.addEventListener('pointerdown', (event) => { startX = event.clientX; stage.setPointerCapture?.(event.pointerId); }); stage.addEventListener('pointerup', (event) => { if (startX !== null && event.clientX - startX < -44) { event.preventDefault(); advance(); } startX = null; }); return;
          }
          root.innerHTML = `<section class="panel features" aria-labelledby="features-title"><div class="features-heading"><p class="eyebrow">功能区</p><h1 id="features-title">你的空间已经打开</h1><p class="muted">选择一个入口，直接进入对应功能。</p></div><div class="feature-grid"><a class="feature life" href="/life"><strong class="feature-title">生活记录</strong></a><a class="feature community" href="/community"><strong class="feature-title">社区</strong></a><a class="feature fitness" href="/fitness"><strong class="feature-title">健身</strong></a><a class="feature history" href="/history"><strong class="feature-title">读书感悟</strong></a><a class="feature timeline" href="/timeline"><strong class="feature-title">时间线</strong></a><a class="feature membership" href="/membership"><strong class="feature-title">会员中心</strong><span class="feature-note">等级、有效期、支付与会员权益</span></a><a class="feature benefits" href="/benefits"><strong class="feature-title">福利中心</strong><span class="feature-note">福利、优惠券与兑换状态</span></a><a class="feature github" href="/connected-apps?provider=GITHUB#github"><strong class="feature-title">连接 GitHub</strong></a><a class="feature x" href="/connected-apps?provider=X#x"><strong class="feature-title">连接 X</strong></a></div><p class="connection-note">GitHub 和 X 会在连接页面由你主动确认官方授权；未配置服务时会明确显示未连接。</p><button class="secondary" id="restart" type="button">重新浏览四张卡片</button></section>`;
          document.querySelector('#restart').addEventListener('click', () => { step = 'cards'; cardIndex = 0; sessionStorage.setItem('mezip-post-login-app-v2-state', 'cards'); render(); });
        };
        render();
      })();
    </script>
  </body>
</html>
