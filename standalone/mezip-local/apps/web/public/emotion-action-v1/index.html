<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Emotion. · Action.</title>
  <style>
    :root { --bg: #101015; --panel: #191920; --line: #ffffff1d; --text: #f8f3ea; --muted: #bdb5a8; --gold: #f2cc87; --rose: #f09a7d; --aqua: #78d5cf; --danger: #ff8d9d; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { min-width: 320px; margin: 0; color: var(--text); font: 14px/1.5 Inter, "Microsoft YaHei UI", system-ui, sans-serif; background: radial-gradient(circle at 82% -5%, #64403138, transparent 31%), radial-gradient(circle at 10% 85%, #235a6030, transparent 31%), var(--bg); }
    button, input { font: inherit; } button { cursor: pointer; } button:disabled { cursor: default; opacity: .48; }
    .page { width: min(1040px, 100%); margin: 0 auto; padding: clamp(18px, 4vw, 44px) clamp(14px, 4vw, 36px) 64px; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
    .brand { display: grid; gap: 2px; } .brand strong { color: var(--gold); font-size: 18px; letter-spacing: .08em; } .brand span { color: var(--muted); font-size: 11px; letter-spacing: .12em; }
    .back { border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; color: #eee4d3; background: #ffffff08; font-size: 12px; text-decoration: none; }
    .back:hover { border-color: #f2cc8790; background: #f2cc8712; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(145deg, #1b1a20ed, #131318ed); box-shadow: inset 0 1px #ffffff11, 0 18px 38px #0004; }
    .capture { padding: clamp(16px, 3vw, 23px); }
    .capture-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .capture-head h1 { margin: 0; font-size: clamp(23px, 4vw, 32px); letter-spacing: .02em; } .capture-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .live { flex: 0 0 auto; padding: 5px 8px; border: 1px solid #ffffff1c; border-radius: 999px; color: #c7bbb0; background: #0000001b; font-size: 11px; white-space: nowrap; }
    .live.active { color: #ffd8dd; border-color: #f7788d80; background: #6a203029; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 19px; }
    .button { min-height: 39px; padding: 0 13px; border: 1px solid #ffffff2b; border-radius: 7px; color: #f4eee6; background: #ffffff0a; font-size: 12px; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
    .button:hover:not(:disabled) { border-color: #f2cc87a8; background: #f2cc8715; transform: translateY(-1px); }
    .button.primary { border-color: #e88d76a8; color: #fff0ea; background: linear-gradient(135deg, #7f4438, #4d2838); }
    .button.stop { border-color: #ec73858d; color: #ffe5e9; background: #551f2b; }
    .button.action { border-color: #76d8d095; color: #e4fffc; background: #1752533d; }
    .microphone { display: inline-flex; align-items: center; gap: 7px; min-height: 39px; padding: 0 11px; border: 1px solid #ffffff26; border-radius: 7px; color: #d8d0c6; background: #0000001a; font-size: 12px; }
    .microphone input { width: 15px; height: 15px; accent-color: var(--rose); }
    .capture-note { min-height: 19px; margin: 12px 0 0; color: #bcb4aa; font-size: 12px; }
    .counts { display: flex; gap: 20px; margin-top: 18px; padding-top: 14px; border-top: 1px solid #ffffff14; }
    .counts div { display: grid; gap: 1px; } .counts span { color: var(--muted); font-size: 11px; } .counts strong { color: var(--gold); font-size: 22px; } .counts strong.aqua { color: var(--aqua); }
    .libraries { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
    .library { min-width: 0; scroll-margin-top: 20px; }
    .library-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 15px 15px 12px; border-bottom: 1px solid #ffffff14; }
    .library-head h2 { margin: 0; font-size: 17px; letter-spacing: .03em; } .library-head p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .refresh { min-height: 31px; padding: 0 9px; border: 1px solid #ffffff26; border-radius: 6px; color: #ded5cb; background: #ffffff08; font-size: 11px; }
    .refresh:hover { border-color: #f2cc8790; }
    .library-list { display: grid; gap: 1px; min-height: 146px; background: #ffffff0a; }
    .asset { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 9px 11px; background: #131319; }
    .asset-preview { width: 74px; height: 48px; display: grid; place-items: center; overflow: hidden; border: 1px solid #ffffff14; border-radius: 6px; color: #e1ddd4; background: linear-gradient(135deg, #34575a, #463044); }
    .asset-preview img, .asset-preview video { width: 100%; height: 100%; object-fit: cover; }
    .asset-meta { min-width: 0; } .asset-name { overflow: hidden; color: #f6f0e8; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; } .asset-detail { overflow: hidden; margin-top: 3px; color: #a89f95; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .asset-actions { display: flex; gap: 5px; } .icon { width: 30px; height: 30px; border: 1px solid #ffffff25; border-radius: 6px; color: #e7e0d8; background: #ffffff09; } .icon:hover { border-color: #f2cc87a2; } .icon.delete:hover { border-color: #ff9eab; color: #ffe7ea; background: #541e2a; }
    .empty { display: grid; min-height: 146px; place-items: center; padding: 20px; color: #968d84; font-size: 12px; text-align: center; background: #131319; }
    .footer { margin: 12px 2px 0; color: #958c84; font-size: 11px; }
    dialog { width: min(880px, calc(100vw - 28px)); max-height: calc(100vh - 28px); padding: 0; overflow: hidden; border: 1px solid #ffffff2d; border-radius: 8px; color: var(--text); background: #15151b; box-shadow: 0 24px 60px #000a; }
    dialog::backdrop { background: #020306b8; backdrop-filter: blur(5px); }
    .dialog-inner { padding: 14px; } .dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; } .dialog-head h3 { margin: 0; font-size: 15px; }
    .media { min-height: 180px; display: grid; place-items: center; overflow: auto; border: 1px solid #ffffff16; border-radius: 6px; background: #020305; } .media img, .media video { display: block; max-width: 100%; max-height: calc(100vh - 190px); object-fit: contain; }
    .dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 12px; } .dialog-copy { margin: 0; color: #c6bdb5; line-height: 1.65; }
    .selection { display: grid; min-height: 240px; place-items: center; overflow: auto; border: 1px solid #ffffff16; border-radius: 6px; background: #020305; } #selection-canvas { max-width: 100%; max-height: calc(100vh - 200px); touch-action: none; cursor: crosshair; }
    .toast { position: fixed; z-index: 20; right: 18px; bottom: 18px; max-width: min(400px, calc(100vw - 36px)); padding: 10px 12px; border: 1px solid #f2cc8770; border-radius: 7px; color: #f6eee5; background: #1b1714ee; box-shadow: 0 14px 34px #0007; font-size: 12px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .2s ease, transform .2s ease; } .toast.show { opacity: 1; transform: none; }
    @media (max-width: 690px) { .page { padding: 18px 13px 46px; } .libraries { grid-template-columns: 1fr; } .capture-head { display: block; } .live { display: inline-flex; margin-top: 10px; } .controls .button { flex: 1 1 calc(50% - 8px); } .microphone { flex: 1 1 100%; justify-content: center; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><div class="brand"><strong>Emotion. / Action.</strong><span>LOCAL WATCH CAPTURE</span></div><a class="back" href="/post-login-app/index.html#emotion-library">返回功能区</a></header>
    <section class="panel capture" aria-labelledby="capture-heading">
      <div class="capture-head"><div><h1 id="capture-heading">观影录制</h1><p>视频与截图分别保存。</p></div><div class="live" id="capture-status" aria-live="polite">等待操作</div></div>
      <div class="controls"><button class="button primary" id="record" type="button">开始录制</button><button class="button stop" id="stop" type="button" disabled>停止并保存</button><button class="button action" id="full-shot" type="button">全屏截图</button><button class="button" id="partial-shot" type="button">局部截图</button><label class="microphone"><input id="microphone" type="checkbox" />录制麦克风</label></div>
      <p class="capture-note" id="capture-note">录制视频将保存到 Emotion.</p>
      <div class="counts"><div><span>Emotion. 视频</span><strong id="emotion-count">0</strong></div><div><span>Action. 截图</span><strong class="aqua" id="action-count">0</strong></div></div>
    </section>
    <section class="libraries" aria-label="本地资料库">
      <section class="panel library" id="emotion-library" aria-labelledby="emotion-heading"><header class="library-head"><div><h2 id="emotion-heading">Emotion.</h2><p>观影视频录制</p></div><button class="refresh" data-refresh="emotion" type="button">刷新</button></header><div class="library-list" id="emotion-list" aria-live="polite"><div class="empty">正在读取视频资料库…</div></div></section>
      <section class="panel library" id="action-library" aria-labelledby="action-heading"><header class="library-head"><div><h2 id="action-heading">Action.</h2><p>全屏与局部截图</p></div><button class="refresh" data-refresh="action" type="button">刷新</button></header><div class="library-list" id="action-list" aria-live="polite"><div class="empty">正在读取截图资料库…</div></div></section>
    </section>
    <p class="footer">删除素材会移到 Windows 回收站，不会永久删除。</p>
  </main>

  <dialog id="preview-dialog"><div class="dialog-inner"><div class="dialog-head"><h3 id="preview-title">素材预览</h3><button class="icon" id="preview-close" type="button" aria-label="关闭" title="关闭">×</button></div><div class="media" id="preview-media"></div><div class="dialog-actions"><a class="button" id="download" href="#" download>下载副本</a><button class="button stop" id="preview-delete" type="button">移到回收站</button></div></div></dialog>
  <dialog id="delete-dialog"><div class="dialog-inner"><div class="dialog-head"><h3>移到回收站</h3><button class="icon" id="delete-close" type="button" aria-label="关闭" title="关闭">×</button></div><p class="dialog-copy" id="delete-copy"></p><div class="dialog-actions"><button class="button" id="delete-cancel" type="button">取消</button><button class="button stop" id="delete-confirm" type="button">确认移到回收站</button></div></div></dialog>
  <dialog id="selection-dialog"><div class="dialog-inner"><div class="dialog-head"><h3>局部截图</h3><button class="icon" id="selection-close" type="button" aria-label="取消" title="取消">×</button></div><div class="selection"><canvas id="selection-canvas"></canvas></div><div class="dialog-actions"><button class="button" id="selection-cancel" type="button">取消</button></div></div></dialog>
  <div class="toast" id="toast" role="status"></div>

  <script>
    (() => {
      'use strict';
      const $ = (selector) => document.querySelector(selector);
      const endpoint = '/api/film-studio/v1';
      const state = { recording: false, recorder: null, display: null, microphone: null, mixer: null, chunks: [], startedAt: 0, libraries: { emotion: [], action: [] }, selected: null, pendingDelete: null, source: null, start: null, rect: null };
      const formatBytes = (value) => { const bytes = Number(value || 0); return bytes < 1024 * 1024 ? `${Math.max(1, Math.round(bytes / 1024))} KB` : `${(bytes / 1024 / 1024).toFixed(1)} MB`; };
      const formatDate = (value) => { const date = new Date(value); return Number.isNaN(date.getTime()) ? '时间未知' : date.toLocaleString('zh-CN'); };
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
      const setStatus = (message, active) => { const status = $('#capture-status'); status.textContent = message; status.classList.toggle('active', Boolean(active)); };
      const toast = (message) => { const item = $('#toast'); item.textContent = message; item.classList.add('show'); clearTimeout(window.__emotionToast); window.__emotionToast = window.setTimeout(() => item.classList.remove('show'), 3200); };
      const open = (dialog) => { if (!dialog.open) dialog.showModal(); }; const close = (dialog) => { if (dialog.open) dialog.close(); };
      const stopTracks = (stream) => { if (stream) stream.getTracks().forEach((track) => track.stop()); };
      const chooseMime = () => ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find((mime) => window.MediaRecorder && MediaRecorder.isTypeSupported(mime)) || '';
      const resetStreams = () => { stopTracks(state.display); stopTracks(state.microphone); state.display = null; state.microphone = null; if (state.mixer) state.mixer.close().catch(() => {}); state.mixer = null; };
      async function displayStream() { if (!navigator.mediaDevices?.getDisplayMedia) throw new Error('请使用新版 Edge 或 Chrome 进行屏幕捕获。'); return navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30, max: 30 } }, audio: true, selfBrowserSurface: 'exclude' }); }
      async function combinedStream(display) { const stream = new MediaStream(); const video = display.getVideoTracks()[0]; if (!video) throw new Error('没有取得视频画面。'); stream.addTrack(video); if ($('#microphone').checked) { try { state.microphone = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); } catch { throw new Error('麦克风未获授权，未开始录制。'); } } const sources = [display, state.microphone].filter(Boolean).filter((item) => item.getAudioTracks().length); if (!sources.length) return stream; try { state.mixer = new (window.AudioContext || window.webkitAudioContext)(); const destination = state.mixer.createMediaStreamDestination(); sources.forEach((item) => state.mixer.createMediaStreamSource(item).connect(destination)); destination.stream.getAudioTracks().forEach((track) => stream.addTrack(track)); } catch { sources.forEach((item) => item.getAudioTracks().forEach((track) => stream.addTrack(track))); } return stream; }
      async function upload(kind, blob) { const response = await fetch(`${endpoint}/upload/${kind}`, { method: 'POST', headers: { 'content-type': blob.type || (kind === 'emotion' ? 'video/webm' : 'image/png') }, body: blob }); if (!response.ok) { const detail = await response.json().catch(() => ({})); throw new Error(detail.error || '保存失败'); } return response.json(); }
      async function refresh() { try { const response = await fetch(`${endpoint}/libraries`, { cache: 'no-store' }); if (!response.ok) throw new Error(); const data = await response.json(); state.libraries.emotion = Array.isArray(data.emotion) ? data.emotion : []; state.libraries.action = Array.isArray(data.action) ? data.action : []; drawLibrary('emotion'); drawLibrary('action'); $('#emotion-count').textContent = String(state.libraries.emotion.length); $('#action-count').textContent = String(state.libraries.action.length); } catch { ['emotion', 'action'].forEach((kind) => { $(`#${kind}-list`).innerHTML = '<div class="empty">资料库暂时不可用。</div>'; }); } }
      function drawLibrary(kind) { const list = $(`#${kind}-list`); const items = state.libraries[kind]; list.innerHTML = ''; if (!items.length) { list.innerHTML = `<div class="empty">${kind === 'emotion' ? 'Emotion. 暂无视频。' : 'Action. 暂无截图。'}</div>`; return; } items.forEach((item) => list.appendChild(assetRow(kind, item))); }
      function assetRow(kind, item) { const row = document.createElement('article'); row.className = 'asset'; const preview = document.createElement('button'); preview.type = 'button'; preview.className = 'asset-preview'; preview.title = '预览'; preview.setAttribute('aria-label', `预览 ${item.name}`); if (kind === 'emotion') { const video = document.createElement('video'); video.src = item.url; video.muted = true; video.preload = 'metadata'; preview.appendChild(video); } else { const image = document.createElement('img'); image.src = item.url; image.alt = ''; preview.appendChild(image); } const meta = document.createElement('div'); meta.className = 'asset-meta'; meta.innerHTML = `<div class="asset-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div><div class="asset-detail">${escapeHtml(formatBytes(item.size))} · ${escapeHtml(formatDate(item.modifiedAt))}</div>`; const actions = document.createElement('div'); actions.className = 'asset-actions'; const view = document.createElement('button'); view.className = 'icon'; view.type = 'button'; view.textContent = '↗'; view.title = '查看'; const remove = document.createElement('button'); remove.className = 'icon delete'; remove.type = 'button'; remove.textContent = '⌫'; remove.title = '移到回收站'; preview.addEventListener('click', () => previewAsset(kind, item)); view.addEventListener('click', () => previewAsset(kind, item)); remove.addEventListener('click', () => requestDelete(kind, item)); actions.append(view, remove); row.append(preview, meta, actions); return row; }
      function previewAsset(kind, item) { state.selected = { kind, item }; const container = $('#preview-media'); container.innerHTML = ''; const media = document.createElement(kind === 'emotion' ? 'video' : 'img'); media.src = item.url; if (kind === 'emotion') { media.controls = true; media.autoplay = true; } else media.alt = item.name; container.appendChild(media); $('#preview-title').textContent = kind === 'emotion' ? 'Emotion. 视频' : 'Action. 截图'; $('#download').href = item.url; $('#download').download = item.name; open($('#preview-dialog')); }
      function requestDelete(kind, item) { state.pendingDelete = { kind, item }; $('#delete-copy').textContent = `“${item.name}”将移到 Windows 回收站，可以从回收站恢复。`; open($('#delete-dialog')); }
      async function deleteConfirmed() { const pending = state.pendingDelete; if (!pending) return; $('#delete-confirm').disabled = true; try { const response = await fetch(`${endpoint}/delete/${pending.kind}/${encodeURIComponent(pending.item.name)}`, { method: 'DELETE', headers: { 'x-film-studio-confirm': 'recycle-bin' } }); if (!response.ok) { const data = await response.json().catch(() => ({})); throw new Error(data.error || '无法移到回收站'); } close($('#delete-dialog')); close($('#preview-dialog')); state.pendingDelete = null; toast('已移到 Windows 回收站。'); await refresh(); } catch (error) { toast(error.message || '无法移到回收站。'); } finally { $('#delete-confirm').disabled = false; } }
      async function record() { if (state.recording) return; if (!window.MediaRecorder) { toast('当前浏览器不支持视频录制。'); return; } try { setStatus('正在请求录制权限…'); state.display = await displayStream(); const stream = await combinedStream(state.display); state.chunks = []; const mime = chooseMime(); state.recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); state.recorder.ondataavailable = (event) => { if (event.data?.size) state.chunks.push(event.data); }; state.recorder.onstop = async () => { const blob = new Blob(state.chunks, { type: state.recorder.mimeType || 'video/webm' }); resetStreams(); state.recording = false; $('#record').disabled = false; $('#stop').disabled = true; if (!blob.size) { setStatus('未生成视频'); return; } try { setStatus('正在保存到 Emotion.…'); await upload('emotion', blob); setStatus('已保存到 Emotion.'); $('#capture-note').textContent = $('#microphone').checked ? '视频已保存，包含麦克风。' : '视频已保存到 Emotion.'; await refresh(); } catch (error) { setStatus('视频保存失败'); toast(error.message || '视频保存失败。'); } }; state.display.getVideoTracks()[0].addEventListener('ended', () => { if (state.recording) stop(); }, { once: true }); state.startedAt = Date.now(); state.recording = true; state.recorder.start(1000); $('#record').disabled = true; $('#stop').disabled = false; setStatus($('#microphone').checked ? '正在录制 · 麦克风开启' : '正在录制', true); $('#capture-note').textContent = $('#microphone').checked ? '屏幕外说话会录入视频。' : '录制视频将保存到 Emotion.'; } catch (error) { resetStreams(); setStatus('等待操作'); toast(error.message || '未获得录制权限。'); } }
      function stop() { if (!state.recording || !state.recorder) return; $('#stop').disabled = true; setStatus('正在保存…', true); if (state.recorder.state !== 'inactive') state.recorder.stop(); }
      function blobFor(canvas) { return new Promise((resolve, reject) => canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('截图编码失败')), 'image/png')); }
      async function sourceCanvas() { const stream = await displayStream(); const video = document.createElement('video'); video.srcObject = stream; video.muted = true; video.playsInline = true; try { await video.play(); await new Promise((resolve) => video.readyState >= 2 ? resolve() : video.addEventListener('loadeddata', resolve, { once: true })); await new Promise((resolve) => window.setTimeout(resolve, 80)); const track = stream.getVideoTracks()[0]; const size = track?.getSettings?.() || {}; const width = video.videoWidth || size.width || 0; const height = video.videoHeight || size.height || 0; if (!width || !height) throw new Error('没有取得可截图的画面。'); const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(video, 0, 0, width, height); return canvas; } finally { stopTracks(stream); video.srcObject = null; } }
      async function saveShot(canvas) { const blob = await blobFor(canvas); setStatus('正在保存到 Action.…'); await upload('action', blob); setStatus('已保存到 Action.'); $('#capture-note').textContent = '截图已保存到 Action.'; await refresh(); }
      async function fullShot() { try { setStatus('正在请求截图权限…'); await saveShot(await sourceCanvas()); } catch (error) { setStatus('等待操作'); toast(error.message || '未获得截图权限。'); } }
      function redrawSelection() { const display = $('#selection-canvas'); const source = state.source; if (!source) return; display.width = source.width; display.height = source.height; const context = display.getContext('2d'); context.drawImage(source, 0, 0); const rect = state.rect; if (!rect) return; context.fillStyle = 'rgba(0,0,0,.5)'; context.fillRect(0, 0, display.width, display.height); context.clearRect(rect.x, rect.y, rect.width, rect.height); context.drawImage(source, rect.x, rect.y, rect.width, rect.height, rect.x, rect.y, rect.width, rect.height); context.strokeStyle = '#78d5cf'; context.lineWidth = Math.max(2, display.width / 1000); context.strokeRect(rect.x, rect.y, rect.width, rect.height); }
      function selectionPoint(event) { const display = $('#selection-canvas'); const bounds = display.getBoundingClientRect(); return { x: Math.max(0, Math.min(display.width, (event.clientX - bounds.left) * display.width / bounds.width)), y: Math.max(0, Math.min(display.height, (event.clientY - bounds.top) * display.height / bounds.height)) }; }
      async function partialShot() { try { setStatus('正在请求局部截图权限…'); state.source = await sourceCanvas(); state.start = null; state.rect = null; redrawSelection(); open($('#selection-dialog')); setStatus('拖动选择区域'); } catch (error) { setStatus('等待操作'); toast(error.message || '未获得截图权限。'); } }
      async function finishSelection() { const rect = state.rect; const source = state.source; if (!rect || !source || rect.width < 12 || rect.height < 12) { toast('请选择更大的区域。'); return; } const crop = document.createElement('canvas'); crop.width = Math.round(rect.width); crop.height = Math.round(rect.height); crop.getContext('2d').drawImage(source, rect.x, rect.y, rect.width, rect.height, 0, 0, crop.width, crop.height); close($('#selection-dialog')); state.source = null; state.rect = null; await saveShot(crop); }
      $('#record').addEventListener('click', record); $('#stop').addEventListener('click', stop); $('#full-shot').addEventListener('click', fullShot); $('#partial-shot').addEventListener('click', partialShot); document.querySelectorAll('[data-refresh]').forEach((button) => button.addEventListener('click', () => { void refresh(); })); $('#preview-close').addEventListener('click', () => close($('#preview-dialog'))); $('#preview-delete').addEventListener('click', () => state.selected && requestDelete(state.selected.kind, state.selected.item)); $('#delete-close').addEventListener('click', () => close($('#delete-dialog'))); $('#delete-cancel').addEventListener('click', () => close($('#delete-dialog'))); $('#delete-confirm').addEventListener('click', deleteConfirmed); const cancelSelection = () => { state.source = null; state.start = null; state.rect = null; close($('#selection-dialog')); setStatus('等待操作'); }; $('#selection-close').addEventListener('click', cancelSelection); $('#selection-cancel').addEventListener('click', cancelSelection);
      $('#selection-canvas').addEventListener('pointerdown', (event) => { const point = selectionPoint(event); state.start = point; state.rect = { x: point.x, y: point.y, width: 0, height: 0 }; event.currentTarget.setPointerCapture(event.pointerId); redrawSelection(); }); $('#selection-canvas').addEventListener('pointermove', (event) => { if (!state.start) return; const point = selectionPoint(event); state.rect = { x: Math.min(state.start.x, point.x), y: Math.min(state.start.y, point.y), width: Math.abs(point.x - state.start.x), height: Math.abs(point.y - state.start.y) }; redrawSelection(); }); $('#selection-canvas').addEventListener('pointerup', (event) => { if (!state.start) return; state.start = null; event.currentTarget.releasePointerCapture?.(event.pointerId); void finishSelection(); });
      window.addEventListener('beforeunload', () => { if (state.recorder?.state === 'recording') state.recorder.stop(); else resetStreams(); }); window.setInterval(() => { if (!state.recording) void refresh(); }, 15000); void refresh();
    })();
  </script>
