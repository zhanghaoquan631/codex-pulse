<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a10" />
    <meta name="description" content="ME.zip 的原创互动视觉实验室。" />
    <title>互动视觉实验室 · ME.zip</title>
    <script>

        document.documentElement.classList.add('embed-mode');
      }
    </script>
    <link rel="stylesheet" href="./motion-lab.css" />

  <body>
    <main class="lab-page">

        <a class="back-link" href="/post-login-app/index.html" aria-label="回到功能区">ME.zip</a>

        </div>
        <p class="lab-status" id="labStatus">原创视觉版</p>

      <section class="lab-layout" aria-label="互动模块库">

          <a href="#circle-gallery" data-demo="circle-gallery"><span>01</span>圆环画廊</a>
          <a href="#animated-list" data-demo="animated-list"><span>02</span>动画列表</a>
          <a href="#comparison-slider" data-demo="comparison-slider"><span>03</span>比较滑块</a>

          <a href="#watercolor" data-demo="watercolor"><span>06</span>水彩画</a>

          <a href="#blur-highlight" data-demo="blur-highlight"><span>08</span>模糊高光</a>

          <a href="#tumble-carousel" data-demo="tumble-carousel"><span>23</span>翻滚旋转木马</a>

        <section class="demo-panel" aria-live="polite">
          <div class="demo-kicker">
            <span id="demoNumber">01</span>
            <span id="demoEnglish">CIRCLE GALLERY</span>
          </div>
          <h2 id="demoTitle">圆环画廊</h2>
          <div class="demo-stage" id="demoStage" tabindex="0" aria-label="当前互动演示"></div>
        </section>
