<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="color-scheme" content="light"/><meta name="theme-color" content="#f6f7f9"/><title>ME.zip · 财务账本</title><link rel="stylesheet" href="./simple.css"/></head>
<body><div class="app-shell">
<header class="topbar"><a class="brand" href="#ledger" aria-label="财务账本首页"><span class="brand-mark">m.</span><strong>ME.zip</strong><span class="brand-divider"></span><span>财务账本</span></a><div class="top-meta"><span id="connection-state" class="connection-state">正在连接手机收件箱</span><button id="refresh" class="icon-button" title="刷新收件箱" aria-label="刷新收件箱">↻</button></div></header>
<main><section class="page-heading"><div><span class="eyebrow">PERSONAL LEDGER</span><h1>把每一笔，记清楚。</h1><p>手机随手传，电脑核对后入账。</p></div><div class="heading-actions"><button class="button" id="make-link"><span aria-hidden="true">▯</span> 手机录入</button><button class="button" id="import"><span aria-hidden="true">↓</span> 导入账单</button><button class="button primary" id="add"><span aria-hidden="true">＋</span> 记一笔</button></div></section>
<div id="demo-banner" class="demo-banner" hidden>演示数据 · 用于查看设计与试用功能，不会写入你的真实账本。<a href="./index.html#ledger">返回真实账本 →</a></div>
<section class="summary-section" aria-label="收支汇总"><div class="summary-heading"><span id="summary-period">本月收支</span><div class="period-controls"><label class="sr-only" for="month">统计月份</label><input id="month" type="month"/><button class="text-button" id="all-period">查看全部</button></div></div><div id="summary" class="summary-grid"></div></section>
<section class="ledger-panel"><div class="panel-top"><nav class="section-tabs" aria-label="账本功能"><button data-route="ledger" class="is-active">账本 <span id="tab-ledger">0</span></button><button data-route="pending">待确认 <span id="tab-pending">0</span></button></nav><details class="data-menu"><summary>数据 <span aria-hidden="true">⌄</span></summary><div><button id="export-csv">导出账本 CSV</button><button id="backup">备份全部数据</button><button id="restore">恢复备份</button><button id="trash">回收站</button></div></details></div><section id="page-content"></section></section>
<footer class="app-footer"><span><i></i> 账本保存在当前电脑浏览器</span><span>手机提交后，确认前不计入收支。</span></footer></main></div>
<dialog id="app-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog><div id="toast" class="toast" role="status" hidden></div>
<script src="../finance-center-v2/finance-core.js"></script><script src="./vendor/qrcode-generator-1.4.4.js"></script><script src="./ledger-import.js"></script><script src="./simple-app.js"></script></body></html>
