<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070a10" />
    <meta
      name="description"
      content="ME.zip GitHub 工作台 V4：授权后自动同步真实 GitHub 数据，并提供仓库、片段、Issues 与任务中心。"
    />
    <title>ME.zip · GitHub 工作台 V4</title>
    <link rel="stylesheet" href="/github-workspace-v1/styles.css" />
    <style>
      .v4-sync-overlay {
        position: fixed;
        z-index: 20;
        inset: auto 24px 24px auto;
        max-width: min(420px, calc(100vw - 48px));
        padding: 14px 16px;
        border: 1px solid #8b5cf680;
        border-radius: 12px;
        background: #121522f2;
        box-shadow: 0 18px 50px #0008;
        color: #f0f3f6;
      }
      .v4-sync-overlay strong,
      .v4-sync-overlay span { display: block; }
      .v4-sync-overlay span { margin-top: 5px; color: #a8b0bc; font-size: 13px; line-height: 1.5; }
      .v4-sync-overlay button { margin-top: 12px; min-height: 34px; padding: 0 12px; border: 1px solid #8b5cf680; border-radius: 8px; background: #8b5cf626; color: #fff; cursor: pointer; }
      .v4-overview-panel { margin-top: 16px; }
      .v4-overview-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
      .v4-overview-metric { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: #ffffff04; }
      .v4-overview-metric span { display: block; color: var(--muted); font-size: 12px; }
      .v4-overview-metric strong { display: block; margin-top: 6px; font-size: 20px; }
      .v4-feature-note { margin: 14px 0 0; color: var(--muted); font-size: 13px; }
      .v4-task-meta { margin-top: 10px; color: var(--muted); font-size: 12px; line-height: 1.6; }
      @media (max-width: 720px) { .v4-overview-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    </style>
    <script>
      (() => {
        const url = new URL(location.href);
        if (url.searchParams.has('preview')) {
          url.searchParams.delete('preview');
          history.replaceState(null, '', `${url.pathname}${url.search}${url.hash}`);
        }
      })();
    </script>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <noscript>请启用 JavaScript 后使用 GitHub 工作台。</noscript>
    <script src="/github-workspace-v4/auto-sync.js"></script>
    <script src="/github-workspace-v1/app.js"></script>
    <script src="/github-workspace-v4/enhancements.js"></script>
    <script src="/github-workspace-v4/feature-controls.js"></script>
  </body>
</html>
