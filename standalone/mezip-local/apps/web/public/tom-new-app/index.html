<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="独立的夜空小镇场景网站。" />
    <title>Night Town</title>
    <style>
      :root { color-scheme: dark; background: #05070c; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: #05070c; }
      body { overflow: hidden; }
      .night-town { position: relative; width: 100vw; height: 100vh; overflow: hidden; isolation: isolate; background: #05070c; }
      .night-town::before {
        position: absolute; z-index: 1; inset: 0; content: ""; pointer-events: none;
        background: radial-gradient(circle at 50% 18%, rgba(65,77,127,.18), transparent 28%), radial-gradient(circle at 70% 38%, rgba(177,144,82,.09), transparent 20%), linear-gradient(180deg, transparent 54%, rgba(3,5,9,.5));
      }
      .night-town::after { position: absolute; z-index: 3; inset: 0; content: ""; pointer-events: none; opacity: .13; background-image: radial-gradient(rgba(255,255,255,.42) .45px, transparent .55px); background-size: 4px 4px; mix-blend-mode: screen; }
      svg { display: block; width: 100%; height: 100%; }
      .line { fill: none; stroke: #c8b787; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .fine { fill: none; stroke: rgba(200,183,135,.66); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
      .dim { fill: none; stroke: rgba(200,183,135,.34); stroke-width: 1; }
      .window { fill: rgba(231,211,151,.16); stroke: #c8b787; stroke-width: 1.5; }
      .star { fill: #fff4c9; filter: url(#glow); }
      .star-dim { fill: rgba(255,244,201,.54); }
      @media (prefers-reduced-motion: no-preference) { .star-pulse { animation: pulse 3.4s ease-in-out infinite alternate; transform-origin: center; } .star-pulse-slow { animation: pulse 5.6s ease-in-out 1.2s infinite alternate; transform-origin: center; } }
      @keyframes pulse { from { opacity: .42; } to { opacity: 1; } }
    </style>
  </head>
