  <body>
    <main id="app" class="page" aria-live="polite"></main>
    <script>
      (() => {
        const root = document.querySelector('#app');
        const cards = [
          '/after-login-cards/card-1-cropped.jpg',
          '/after-login-cards/card-2.jpg',
          '/after-login-cards/card-3-cropped.jpg',
          '/after-login-cards/card-4.jpg',
        ];
        const cardQuotes = [
          { quote: '“I am rooted, but I flow.”', author: 'Virginia Woolf' },
          { quote: '“Life can only be understood backwards; but it must be lived forwards.”', author: 'Søren Kierkegaard' },
          { quote: '“Forever is composed of nows.”', author: 'Emily Dickinson' },
          { quote: '“The true secret of happiness lies in taking a genuine interest in all the details of daily life.”', author: 'William Morris' },
        ];
        const returnTo = '/post-login-app/index.html?fromLogin=1';
        const rawSession = localStorage.getItem('mezip.local-demo-session.v1');
        const hasDemoSession = rawSession === 'active' || rawSession?.includes('"state":"active"');
        const fromLogin = new URLSearchParams(location.search).get('fromLogin') === '1';
        // A valid local demo session is durable across tabs and browser reloads;
        // sessionStorage is only used to remember the card position, never as a
        // second login gate. This prevents a fresh tab from bouncing back to the
        // login screen even though the local session is still active.
        if (!fromLogin && !hasDemoSession) {
          sessionStorage.removeItem('mezip-post-login-app-state');
          location.replace(`/?login=1&returnTo=${encodeURIComponent(returnTo)}`);
          return;
        }
        if (fromLogin && !hasDemoSession) {
          location.replace(`/?login=1&returnTo=${encodeURIComponent(returnTo)}`);
          return;
        }
        if (fromLogin) sessionStorage.setItem('mezip-post-login-app-login-v1', '1');
        if (fromLogin) sessionStorage.removeItem('mezip-post-login-app-state');
        if (fromLogin) history.replaceState({}, '', '/post-login-app/index.html');
        const requestedLibrary = location.hash === '#emotion-library' || location.hash === '#action-library';
        let step = requestedLibrary || sessionStorage.getItem('mezip-post-login-app-state') === 'features' ? 'features' : 'cards';
        let cardIndex = 0;
        let startX = null;
        const bookingOwnerEmail = 'owner@example.com';
        const bookingUrlForDate = (isoDate) => `https://cal.com/albia.dev/discovery-call?date=${encodeURIComponent(isoDate)}`;
        const bookingSlots = ['17:30', '17:45', '18:00', '18:15', '18:45', '19:00', '19:15', '19:30', '19:45', '20:00'];
        const bookingEarliestIso = '2026-08-21';
        const bookingWeekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const toBookingIso = (year, monthIndex, date) => `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
        const bookingDateInfo = (iso) => {
          const [year, month, date] = iso.split('-').map(Number);
          const value = new Date(year, month - 1, date);
          return { iso, year, monthIndex: month - 1, date, day: bookingWeekdays[value.getDay()] };
        };
        const bookingState = { view: 'schedule', date: bookingEarliestIso, time: '', name: '', email: '', phone: '', note: '', status: '', deliveryStatus: 'NOT_CONFIGURED', monthYear: 2026, monthIndex: 7 };
        const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
        const localCaptureApi = 'http://127.0.0.1:4319';
        const loadGlobalTimelineSummary = async () => {
          const target = document.querySelector('#global-timeline-summary');
          if (!target) return;
          try {
            const [xResponse, watchResponse, resourceResponse] = await Promise.all([
              fetch(`${localCaptureApi}/v1/x/local-capture/timeline?limit=100`, { credentials: 'include', cache: 'no-store' }),
              fetch(`${localCaptureApi}/v1/watch/records?limit=100`, { credentials: 'include', cache: 'no-store' }),
              fetch(`${localCaptureApi}/v1/resources/records`, { credentials: 'include', cache: 'no-store' }),
            ]);
            if (!xResponse.ok || !watchResponse.ok || !resourceResponse.ok) throw new Error('GLOBAL_TIMELINE_UNAVAILABLE');
            const x = await xResponse.json();
            const watch = await watchResponse.json();
            const resources = await resourceResponse.json();
            const events = [
              ...(Array.isArray(x?.data?.events) ? x.data.events.map((item) => ({ at: item.capturedAt, title: item.actionType || 'X 行为', source: 'X' })) : []),
              ...(Array.isArray(watch?.data?.items) ? watch.data.items.map((item) => ({ at: item.lastWatchedAt, title: item.title || '观看进度', source: '观看记录' })) : []),
              ...(Array.isArray(resources?.data?.items) ? resources.data.items.map((item) => ({ at: item.createdAt, title: item.title || '保存资源', source: '资源保存' })) : []),
            ].filter((item) => item.at).sort((left, right) => Date.parse(right.at) - Date.parse(left.at)).slice(0, 4);
            target.innerHTML = `<h3>全局行为时间轴 V7</h3><p>已从本地桥接汇总 X、观看记录和资源行为；完整筛选与打开历史请进入 V7 页面。</p>${events.length ? `<div class="global-timeline-list">${events.map((item) => `<div class="global-timeline-item"><strong>${escapeHtml(item.source)} · ${escapeHtml(item.title)}</strong><span>${escapeHtml(new Date(item.at).toLocaleString('zh-CN'))}</span></div>`).join('')}</div>` : '<p>暂无全局行为记录；只有明确执行操作或从 ME.zip 打开内容后才会出现。</p>'}<a class="text-link" href="/x-local-capture-v7/global-timeline.html">打开完整全局行为时间轴 V7 →</a>`;
          } catch {
            target.innerHTML = '<h3>全局行为时间轴 V7</h3><p>当前无法读取本地桥接；页面不会用演示数据填充时间轴。</p><a class="text-link" href="/x-local-capture-v7/global-timeline.html">打开 V7 并重试 →</a>';
          }
        };
        const emotionState = { items: [], query: '', category: '全部', loading: false, error: false, timer: null };
        const formatEmotionSize = (bytes) => {
          const value = Number(bytes || 0);
          if (value < 1024) return `${value} B`;
          if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
          if (value < 1024 * 1024 * 1024) return `${(value / (1024 * 1024)).toFixed(1)} MB`;
          return `${(value / (1024 * 1024 * 1024)).toFixed(2)} GB`;
        };
        const formatEmotionDate = (value) => {
          const date = new Date(value);
          return Number.isNaN(date.getTime()) ? '时间未知' : date.toLocaleString('zh-CN');
        };
        const mediaLibraryEndpoint = '/api/film-studio/v1';
        let editingLibraryAsset = null;
        let assetLibraryToastTimer = null;
        const libraryStateFor = (kind) => kind === 'emotion' ? emotionState : actionState;
        const assetDisplayName = (item) => String(item.displayName || item.title || item.name || '未命名素材');
        const assetMatches = (item, query) => {
          if (!query) return true;
          const value = [assetDisplayName(item), item.name, item.category, item.purpose, ...(Array.isArray(item.tags) ? item.tags : [])].join(' ').toLocaleLowerCase();
          return value.includes(query);
        };
        const showAssetLibraryToast = (message) => {
          const toast = document.querySelector('#asset-library-toast');
          if (!toast) return;
          toast.textContent = message;
          toast.classList.add('show');
          clearTimeout(assetLibraryToastTimer);
          assetLibraryToastTimer = window.setTimeout(() => toast.classList.remove('show'), 3600);
        };
        const copyText = async (value) => {
          if (navigator.clipboard?.writeText) {
            try {
              await navigator.clipboard.writeText(value);
              return;
            } catch {
              // Fall through for browsers that require a stricter clipboard permission.
            }
          }
          const field = document.createElement('textarea');
          field.value = value;
          field.setAttribute('readonly', '');
          field.style.position = 'fixed';
          field.style.opacity = '0';
          document.body.appendChild(field);
          field.select();
          document.execCommand('copy');
          field.remove();
        };
        const renderCategoryBoard = (kind, state) => {
          const target = document.querySelector(`#${kind}-category-board`);
          if (!target) return;
          const categories = [...new Set(state.items.map((item) => String(item.category || '')).filter(Boolean))].sort((left, right) => left.localeCompare(right, 'zh-CN'));
          const options = ['全部', ...categories];
          target.innerHTML = options.map((category) => `<button type="button" data-category="${escapeHtml(category)}" class="${state.category === category ? 'is-active' : ''}">${escapeHtml(category)}</button>`).join('');
        };
        const renderManagedLibrary = (kind, state) => {
          const list = document.querySelector(`#${kind}-library-list`);
          const status = document.querySelector(`#${kind}-library-status`);
          if (!list || !status) return;
          const query = state.query.trim().toLocaleLowerCase();
          const visibleItems = state.items.filter((item) => assetMatches(item, query) && (state.category === '全部' || item.category === state.category));
          const isEmotion = kind === 'emotion';
          const panelName = isEmotion ? '视频' : '截图';
          const emptyClass = isEmotion ? 'emotion-library-empty' : 'action-library-empty';
          const itemClass = isEmotion ? 'emotion-video' : 'action-screenshot';
          status.textContent = state.error
            ? '资料库暂时不可用；请确认页面仍由 127.0.0.1:5174 提供。'
            : state.loading
              ? '正在读取本机资料库…'
              : `${visibleItems.length} 个${panelName}${query || state.category !== '全部' ? `（全部 ${state.items.length} 个）` : ''} · 标签与用途已保存到本机`;
          renderCategoryBoard(kind, state);
          if (!visibleItems.length) {
            list.innerHTML = state.items.length
              ? `<div class="${emptyClass}">没有符合当前搜索或分类的素材。</div>`
              : `<div class="${emptyClass}">资料库目前为空。完成${isEmotion ? '录制' : '截图'}并保存后，素材会自动出现。</div>`;
            return;
          }
          list.innerHTML = visibleItems.map((item) => {
            const displayName = assetDisplayName(item);
            const tags = Array.isArray(item.tags) ? item.tags.slice(0, 8) : [];
            const preview = isEmotion
              ? `<video controls preload="metadata" playsinline src="${escapeHtml(item.url)}"></video>`
              : `<a class="action-screenshot-preview" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer" title="打开原图：${escapeHtml(displayName)}"><img src="${escapeHtml(item.url)}" alt="截图：${escapeHtml(displayName)}" loading="lazy" /></a>`;
            const previewClass = isEmotion ? 'emotion-video-card' : 'action-screenshot-card';
            const titleClass = isEmotion ? 'emotion-video-title' : 'action-screenshot-title';
            const metaClass = isEmotion ? 'emotion-video-meta' : 'action-screenshot-meta';
            const actionsClass = isEmotion ? 'emotion-video-actions' : 'action-screenshot-actions';
            const shared = Boolean(item.share?.published);
            return `<article class="${previewClass}">${preview}<div class="${titleClass}" title="${escapeHtml(displayName)}">${escapeHtml(displayName)}</div><div class="asset-category">${escapeHtml(item.category || '未分类')}</div><div class="asset-tags">${tags.map((tag) => `<span class="asset-tag">${escapeHtml(tag)}</span>`).join('')}</div>${item.purpose ? `<p class="asset-purpose">${escapeHtml(item.purpose)}</p>` : ''}<div class="${metaClass}"><span>${escapeHtml(formatEmotionSize(item.size))}</span><span>${escapeHtml(formatEmotionDate(item.modifiedAt))}</span></div><div class="${actionsClass}"><a href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">${isEmotion ? '打开视频' : '打开原图'}</a><a href="${escapeHtml(item.url)}" download="${escapeHtml(item.name)}">下载副本</a></div><div class="asset-inline-actions"><button type="button" data-asset-action="edit" data-kind="${kind}" data-name="${escapeHtml(item.name)}">编辑资料</button><button class="share" type="button" data-asset-action="share" data-kind="${kind}" data-name="${escapeHtml(item.name)}">${shared ? '复制分享链接' : '生成分享链接'}</button>${shared ? `<button class="stop-share" type="button" data-asset-action="unpublish" data-kind="${kind}" data-name="${escapeHtml(item.name)}">停止分享</button>` : ''}</div></article>`;
          }).join('');
        };
        const loadManagedLibrary = async (kind, state) => {
          const status = document.querySelector(`#${kind}-library-status`);
          if (!status || state.loading) return;
          state.loading = true;
          state.error = false;
          renderManagedLibrary(kind, state);
          try {
            const response = await fetch(`${mediaLibraryEndpoint}/library/${kind}`, { credentials: 'same-origin', cache: 'no-store' });
            if (!response.ok) throw new Error('MEDIA_LIBRARY_UNAVAILABLE');
            const payload = await response.json();
            state.items = Array.isArray(payload?.items) ? payload.items : [];
          } catch {
            state.items = [];
            state.error = true;
          } finally {
            state.loading = false;
            renderManagedLibrary(kind, state);
          }
        };
        const openAssetEditor = (kind, item) => {
          const dialog = document.querySelector('#asset-editor');
          if (!dialog) return;
          editingLibraryAsset = { kind, name: item.name };
          document.querySelector('#asset-editor-title').textContent = `编辑 ${kind === 'emotion' ? 'Emotion. 视频' : 'Action. 截图'}`;
          document.querySelector('#asset-editor-hint').textContent = '名称、标签和用途会保存在本机；留空的分类会由系统自动归纳。';
          document.querySelector('#asset-title-input').value = item.title || '';
          document.querySelector('#asset-tags-input').value = Array.isArray(item.userTags) ? item.userTags.join('，') : '';
          document.querySelector('#asset-purpose-input').value = item.purpose || '';
          document.querySelector('#asset-category-input').value = item.category || '';
          dialog.showModal();
        };
        const closeAssetEditor = () => {
          const dialog = document.querySelector('#asset-editor');
          if (dialog?.open) dialog.close();
          editingLibraryAsset = null;
        };
        const saveAssetEditor = async () => {
          if (!editingLibraryAsset) return;
          const save = document.querySelector('#asset-editor-save');
          save.disabled = true;
          try {
            const response = await fetch(`${mediaLibraryEndpoint}/metadata/${editingLibraryAsset.kind}/${encodeURIComponent(editingLibraryAsset.name)}`, {
              method: 'PUT',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                title: document.querySelector('#asset-title-input').value,
                tags: document.querySelector('#asset-tags-input').value,
                purpose: document.querySelector('#asset-purpose-input').value,
                category: document.querySelector('#asset-category-input').value,
              }),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload?.item) throw new Error(payload?.error || '保存失败');
            const state = libraryStateFor(editingLibraryAsset.kind);
            state.items = state.items.map((item) => item.name === editingLibraryAsset.name ? payload.item : item);
            renderManagedLibrary(editingLibraryAsset.kind, state);
            closeAssetEditor();
            showAssetLibraryToast('资料已保存，并已重新归类。');
          } catch (error) {
            showAssetLibraryToast(error.message || '资料保存失败。');
          } finally {
            save.disabled = false;
          }
        };
        const copyPublicLink = async (kind, item) => {
          try {
            const response = await fetch(`${mediaLibraryEndpoint}/share/publish/${kind}/${encodeURIComponent(item.name)}`, { method: 'POST' });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload?.publicUrl) {
              const message = payload?.error === 'PUBLIC_SHARE_CONNECTOR_MISSING' ? '公开链接服务尚未就绪。' : (payload?.error || '公开链接生成失败。');
              throw new Error(message);
            }
            await copyText(payload.publicUrl);
            showAssetLibraryToast('公开观看链接已复制。把它发给别人即可直接观看这一项素材。');
            await loadManagedLibrary(kind, libraryStateFor(kind));
          } catch (error) {
            showAssetLibraryToast(error.message || '无法复制分享链接。');
          }
        };
        const stopPublicLink = async (kind, item) => {
          try {
            const response = await fetch(`${mediaLibraryEndpoint}/share/unpublish/${kind}/${encodeURIComponent(item.name)}`, { method: 'POST' });
            if (!response.ok) throw new Error('停止分享失败。');
            showAssetLibraryToast('这项素材的公开链接已失效。');
            await loadManagedLibrary(kind, libraryStateFor(kind));
          } catch (error) {
            showAssetLibraryToast(error.message || '无法停止分享。');
          }
        };
        const setupManagedLibrary = (kind, state) => {
          const input = document.querySelector(`#${kind}-search`);
