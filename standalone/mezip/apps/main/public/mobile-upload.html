<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>手机照片上传</title><link rel="stylesheet" href="/mobile-upload.css"></head>
<body><main>
  <span class="eyebrow">CORTEX / PHOTO</span><h1 id="title">手机照片上传</h1>
  <p id="description">正在验证链接…</p>
  <form id="unlock" hidden><label for="pin">电脑端显示的专属验证码</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required><button>验证个人入口</button></form>
  <form id="upload" hidden><label class="picker" for="photo">选择照片<input id="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" required></label><img id="preview" alt="所选照片" hidden><p id="filename"></p><button id="submit" disabled>上传照片</button><progress id="progress" max="100" value="0" hidden></progress></form>
  <p id="status" role="status" aria-live="polite"></p>
</main><script type="module" src="/mobile-upload.js"></script></body></html>
