<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1114" viewBox="0 0 800 1114">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141f42"/>
      <stop offset="0.52" stop-color="#0e1731"/>
      <stop offset="1" stop-color="#071122"/>
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="21%" r="76%">
      <stop offset="0" stop-color="#7085a4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#0a1328" stop-opacity="0"/>
