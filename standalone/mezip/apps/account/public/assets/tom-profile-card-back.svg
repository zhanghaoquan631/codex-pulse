<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1114" viewBox="0 0 800 1114">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172548"/>
      <stop offset=".54" stop-color="#0d1731"/>
      <stop offset="1" stop-color="#071121"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="37%" r="68%">
      <stop offset="0" stop-color="#8fdbc9" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0b1530" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="800" height="1114" rx="44"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="800" height="1114" fill="url(#night)"/>
    <rect width="800" height="1114" fill="url(#halo)"/>
    <rect x="32" y="28" width="736" height="1058" rx="28" fill="none" stroke="#f5ecd9" stroke-opacity=".2" stroke-width="2"/>
    <text x="400" y="156" text-anchor="middle" fill="#f7f0e5" font-family="KaiTi, STKaiti, DFKai-SB, serif" font-size="70" font-weight="700" letter-spacing="11" filter="url(#glow)">弓弦影</text>
    <text x="400" y="220" text-anchor="middle" fill="#f7f0e5" font-family="KaiTi, STKaiti, DFKai-SB, serif" font-size="36" font-weight="600" letter-spacing="3">FDE 产品经理</text>
    <path d="M104 286 H696" stroke="#e6dcc8" stroke-opacity=".62" stroke-width="2"/>
    <text x="400" y="446" text-anchor="middle" fill="#f7f0e5" font-family="KaiTi, STKaiti, DFKai-SB, serif" font-size="60" font-weight="700" letter-spacing="5">把现场的复杂</text>
    <text x="400" y="536" text-anchor="middle" fill="#f7f0e5" font-family="KaiTi, STKaiti, DFKai-SB, serif" font-size="60" font-weight="700" letter-spacing="5">做成清晰的产品</text>
    <text x="400" y="685" text-anchor="middle" fill="#dfd2bb" font-family="KaiTi, STKaiti, DFKai-SB, serif" font-size="38" font-weight="600" letter-spacing="3">走进真实使用，持续把体验打磨到能交付。</text>
    <path d="M182 782 H618" stroke="#93e6dd" stroke-opacity=".54" stroke-width="2"/>
    <text x="400" y="883" text-anchor="middle" fill="#f7f0e5" fill-opacity=".82" font-family="KaiTi, STKaiti, DFKai-SB, serif" font-size="31" letter-spacing="8">FDE / PRODUCT / FIELD</text>
    <circle cx="400" cy="972" r="14" fill="#93e6dd" fill-opacity=".8"/>
    <circle cx="400" cy="972" r="31" fill="none" stroke="#f7f0e5" stroke-opacity=".35" stroke-width="2"/>
  </g>
</svg>
