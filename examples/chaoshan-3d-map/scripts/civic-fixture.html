<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civic visitor inspection</title><style>body{margin:0}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
import {buildCivicNeighborhoods} from '../civic-neighborhoods.mjs';
import {communityActors} from '../community-actors.mjs';
const theme=new URL(location.href).searchParams.get('theme')||'tea';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a7bfc2');
const camera=new THREE.OrthographicCamera(-.3,.3,.3,-.3,.001,20);camera.position.set(.18,.32,.62);camera.lookAt(0,.055,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(1);document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight('#ffffff','#607566',2));const sun=new THREE.DirectionalLight('#fff1d6',2.5);sun.position.set(-1,3,2);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:'#87a99b'}));floor.rotation.x=-Math.PI/2;floor.position.y=-.001;scene.add(floor);
const civic=buildCivicNeighborhoods({parent:scene,plan:{coverage:[],facilities:[{x:0,y:0,z:0,scale:1,angle:0,nx:0,nz:-1,path:[[0,.01,.3],[0,.01,.16]],theme,variant:0}]}});
const actor=communityActors.find(a=>a.root.userData.civicTheme===theme);
let clock=0;
function render(){civic.update(clock);renderer.render(scene,camera);}
function resize(){const half=innerWidth<600?.63:.26;camera.left=-half*innerWidth/innerHeight;camera.right=-camera.left;camera.top=half;camera.bottom=-half;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();}
addEventListener('resize',resize);resize();
window.civicAudit={ready:true,tick(t){clock=t;render();return this.snapshot();},snapshot(){return {position:actor.root.position.toArray(),state:actor.root.userData.state,limbs:actor.root.children.slice(1,5).map(p=>p.rotation.toArray()),parts:actor.root.children.length};},framed(){const b=new THREE.Box3().setFromObject(civic.group);for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const z of [b.min.z,b.max.z]){const p=new THREE.Vector3(x,y,z).project(camera);if(Math.abs(p.x)>.98||Math.abs(p.y)>.98)return false;}return true;}};
</script></body></html>
